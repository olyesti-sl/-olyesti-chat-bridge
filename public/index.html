 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Olyesti Live</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0604;
      color: #f0e6d3;
      font-family: Georgia, serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    #logo {
      font-size: 22px;
      letter-spacing: 4px;
      color: #c9a84c;
      text-transform: uppercase;
    }

    #tv {
      background: #1a1008;
      border: 8px solid #2a1f0a;
      border-radius: 12px;
      box-shadow: 0 0 60px rgba(201,168,76,0.15), 0 0 20px rgba(0,0,0,0.8);
      padding: 6px;
    }

    #tv iframe {
      display: block;
      border-radius: 6px;
      width: 720px;
      height: 405px;
    }

    #chatBox {
      width: 720px;
      background: rgba(20,12,4,0.95);
      border: 1px solid #3a2a0a;
      border-radius: 10px;
      overflow: hidden;
    }

    #chatHeader {
      background: #1a1008;
      padding: 10px 16px;
      font-size: 12px;
      letter-spacing: 3px;
      color: #c9a84c;
      text-transform: uppercase;
    }

    #msgLog {
      height: 160px;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #msgLog .msg {
      font-size: 14px;
      color: #d4c4a8;
    }

    #msgLog .msg span {
      color: #c9a84c;
      font-weight: bold;
    }

    #composeBar {
      display: flex;
      border-top: 1px solid #3a2a0a;
    }

    #nameInput {
      background: transparent;
      border: none;
      border-right: 1px solid #3a2a0a;
      padding: 12px 16px;
      color: #c9a84c;
      font-family: Georgia, serif;
      font-size: 14px;
      outline: none;
      width: 140px;
    }

    #msgInput {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px 16px;
      color: #f0e6d3;
      font-family: Georgia, serif;
      font-size: 14px;
      outline: none;
    }

    #sendBtn {
      background: #c9a84c;
      border: none;
      padding: 12px 20px;
      color: #0a0604;
      font-family: Georgia, serif;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
    }

    #sendBtn:hover { background: #e0c070; }
  </style>
</head>
<body>

  <div id="logo">☕ Olyesti Café</div>

  <div id="tv">
    <iframe
      src="https://player.twitch.tv/?channel=Olyesti&parent=chat.olyesti.com&muted=false&autoplay=true"
      allowfullscreen>
    </iframe>
  </div>

  <div id="chatBox">
    <div id="chatHeader">💬 Olyesti Chat</div>
    <div id="msgLog"></div>
    <div id="composeBar">
      <input id="nameInput" type="text" placeholder="Your name" maxlength="20" />
      <input id="msgInput" type="text" placeholder="Say something…" maxlength="200" />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const socket = io();
    const log = document.getElementById('msgLog');
    const msgInput = document.getElementById('msgInput');
    const nameInput = document.getElementById('nameInput');
    const sendBtn = document.getElementById('sendBtn');

    const savedName = localStorage.getItem('olyesti-name');
    if (savedName) nameInput.value = savedName;

    function addMsg(name, text) {
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `<span>${name}:</span> ${text}`;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    socket.on('history', (msgs) => msgs.forEach(m => addMsg(m.speaker || m.name, m.text)));
    socket.on('message', (msg) => addMsg(msg.speaker, msg.text));

    function send() {
      const name = nameInput.value.trim() || 'Guest';
      const text = msgInput.value.trim();
      if (!text) return;
      localStorage.setItem('olyesti-name', name);
      socket.emit('web-message', { name, text, avatar: 'guest', gender: 'f' });
      msgInput.value = '';
    }

    sendBtn.onclick = send;
    msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  </script>

</body>
</html>
