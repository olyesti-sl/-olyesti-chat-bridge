<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Olyesti Live Chat</title>
<script src="/socket.io/socket.io.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #050508;
  color: #e8e8e8;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#scene { flex: 1; position: relative; overflow: hidden; }

#bg {
  position: absolute; inset: 0;
  background: url('lounge.jpg') center center / cover no-repeat;
  filter: brightness(0.75);
}
#bg::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.65) 100%);
}

#stage {
  position: absolute;
  bottom: 10%; left: 0; right: 0;
  height: 180px;
  z-index: 10;
  overflow: hidden;
}

.character {
  position: absolute;
  bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

.char-bubble {
  background: rgba(10,8,20,0.9);
  border: 1px solid rgba(255,220,100,0.25);
  border-radius: 12px;
  padding: 7px 12px;
  font-size: 0.82rem;
  color: #e8d8b0;
  max-width: 200px;
  text-align: center;
  margin-bottom: 10px;
  opacity: 0;
  transition: opacity 0.3s;
  line-height: 1.4;
  word-break: break-word;
  position: relative;
  pointer-events: none;
  white-space: nowrap;
}
.char-bubble.visible { opacity: 1; }
.char-bubble::after {
  content: ''; position: absolute;
  bottom: -7px; left: 50%; transform: translateX(-50%);
  border: 7px solid transparent;
  border-top-color: rgba(255,220,100,0.25);
  border-bottom: none;
}

.char-name {
  font-size: 0.65rem;
  color: rgba(255,220,140,0.7);
  margin-top: 6px;
  letter-spacing: 0.06em;
  white-space: nowrap;
  text-shadow: 0 1px 6px rgba(0,0,0,1);
}

.char-shadow {
  width: 60px; height: 8px;
  background: rgba(0,0,0,0.45);
  border-radius: 50%;
  filter: blur(5px);
  margin-top: 3px;
}

footer {
  background: rgba(6,4,2,0.96);
  border-top: 1px solid rgba(255,200,80,0.12);
  padding: 10px 16px 14px;
  z-index: 20;
  display: flex; flex-direction: column; gap: 8px;
}
#identityBar {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.75rem; color: #555;
}
#identityBar #myName { color: #7a6a4a; }
#changeId { cursor: pointer; color: #3a3020; text-decoration: underline; font-size: 0.7rem; }
#changeId:hover { color: #aa9060; }
#compose { display: flex; gap: 8px; }
input, button { font-family: inherit; font-size: 0.9rem; border: none; outline: none; }
#msgInput {
  flex: 1; background: #100e08; color: #e8d8b0;
  border: 1px solid rgba(255,200,80,0.15);
  border-radius: 10px; padding: 10px 14px;
}
#msgInput:focus { border-color: rgba(255,200,80,0.35); }
#sendBtn {
  background: rgba(180,120,20,0.25); color: #d4a840;
  border: 1px solid rgba(255,200,80,0.2);
  border-radius: 10px; padding: 10px 18px;
  cursor: pointer; transition: background 0.2s;
}
#sendBtn:hover { background: rgba(180,120,20,0.4); color: #ffcc60; }

#modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.92);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; overflow-y: auto; padding: 20px;
}
#modalBox {
  background: #0d0a06;
  border: 1px solid rgba(255,200,80,0.15);
  border-radius: 16px;
  padding: 24px 20px; width: 360px;
  display: flex; flex-direction: column; gap: 14px;
}
#modalBox h2 { font-size: 1.1rem; color: #e8c870; }
#nameInput {
  background: #100e08; color: #e8d8b0;
  border: 1px solid rgba(255,200,80,0.2);
  border-radius: 8px; padding: 10px 12px;
  font-size: 0.9rem; font-family: inherit; width: 100%;
}
.picker-label { font-size: 0.72rem; color: #7a6a4a; margin-bottom: 6px; }

.gender-row { display: flex; gap: 8px; }
.gender-btn {
  flex: 1; padding: 8px; border-radius: 8px; cursor: pointer;
  font-family: inherit; font-size: 0.85rem;
  background: #100e08; color: #7a6a4a;
  border: 2px solid transparent; transition: all 0.15s;
}
.gender-btn.selected { border-color: rgba(255,200,80,0.4); color: #e8c870; background: #1a1408; }

.avatar-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.avatar-option {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  cursor: pointer; padding: 6px 4px; border-radius: 8px;
  border: 2px solid transparent; transition: all 0.15s;
  background: #100e08;
}
.avatar-option:hover { border-color: rgba(255,200,80,0.2); }
.avatar-option.selected { border-color: #e8c870; background: #1a1408; }
.avatar-option img {
  width: 48px; height: 72px;
  object-fit: contain; object-position: center bottom;
  mix-blend-mode: multiply;
}
.avatar-option span {
  font-size: 0.55rem; color: #7a6a4a; text-align: center; line-height: 1.2;
}

#previewWrap { display: flex; justify-content: center; padding: 8px 0; }

.modal-btns { display: flex; gap: 8px; }
.modal-btns button {
  flex: 1; padding: 10px; border-radius: 8px;
  cursor: pointer; font-family: inherit; font-size: 0.85rem;
}
#guestBtn { background: #100e08; color: #7a6a4a; border: 1px solid rgba(255,200,80,0.1); }
#saveBtn { background: rgba(180,120,20,0.3); color: #e8c870; border: 1px solid rgba(255,200,80,0.25); }
#guestBtn:hover { background: #181408; }
#saveBtn:hover { background: rgba(180,120,20,0.5); }
</style>
</head>
<body>

<div id="modal">
  <div id="modalBox">
    <h2>Welcome to Olyesti</h2>
    <input id="nameInput" type="text" placeholder="Your display name" maxlength="32" />
    <div>
      <div class="picker-label">Gender</div>
      <div class="gender-row">
        <button class="gender-btn selected" data-gender="female">♀ Female</button>
        <button class="gender-btn" data-gender="male">♂ Male</button>
      </div>
    </div>
    <div>
      <div class="picker-label">Choose your avatar</div>
      <div class="avatar-grid" id="avatarPicker"></div>
    </div>
    <div id="previewWrap"></div>
    <div class="modal-btns">
      <button id="guestBtn">Join as Guest</button>
      <button id="saveBtn">Save & Enter</button>
    </div>
  </div>
</div>

<div id="scene">
  <div id="bg"></div>
  <div id="stage">
    <!-- SL Relay is static, not a wandering character -->
    <div class="character" id="char-sl" data-key="char-sl" style="position:absolute;bottom:0;left:20px;">
      <div class="char-bubble visible" id="bubble-sl">Connected to Second Life</div>
      <div style="position:relative;width:80px;">
        <img src="avatar-m1.png" style="width:80px;height:120px;object-fit:contain;mix-blend-mode:multiply;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.6));" alt="SL Relay" />
      </div>
      <div class="char-name">SL Relay</div>
      <div class="char-shadow"></div>
    </div>
  </div>
</div>

<footer>
  <div id="identityBar">
    <span id="myName">Not joined</span>
    <span id="changeId">change</span>
  </div>
  <div id="compose">
    <input id="msgInput" type="text" placeholder="Message…" maxlength="300" />
    <button id="sendBtn">Send</button>
  </div>
</footer>

<script>
const FEMALE_AVATARS = [
  { file: 'avatar-f1.png', label: 'Hispanic' },
  { file: 'avatar-f2.png', label: 'Black' },
  { file: 'avatar-f3.png', label: 'White' },
  { file: 'avatar-f4.png', label: 'Asian' },
  { file: 'avatar-f5.png', label: 'Hispanic 50+' },
  { file: 'avatar-f6.png', label: 'Black 50+' },
  { file: 'avatar-f7.png', label: 'White 50+' },
  { file: 'avatar-f8.png', label: 'Asian 50+' },
];

const MALE_AVATARS = [
  { file: 'avatar-m1.png', label: 'Hispanic' },
  { file: 'avatar-m2.png', label: 'Black' },
  { file: 'avatar-m3.png', label: 'White' },
  { file: 'avatar-m4.png', label: 'Asian' },
  { file: 'avatar-m5.png', label: 'Hispanic 50+' },
  { file: 'avatar-m6.png', label: 'Black 50+' },
  { file: 'avatar-m7.png', label: 'White 50+' },
  { file: 'avatar-m8.png', label: 'Asian 50+' },
];

let selGender = 'female';
let selAvatar = 'avatar-f1.png';

const avatarPicker = document.getElementById('avatarPicker');

function buildAvatarPicker(gender) {
  avatarPicker.innerHTML = '';
  const list = gender === 'female' ? FEMALE_AVATARS : MALE_AVATARS;
  list.forEach(av => {
    const opt = document.createElement('div');
    opt.className = 'avatar-option' + (av.file === selAvatar ? ' selected' : '');
    opt.dataset.file = av.file;
    const img = document.createElement('img');
    img.src = av.file;
    img.alt = av.label;
    const lbl = document.createElement('span');
    lbl.textContent = av.label;
    opt.appendChild(img);
    opt.appendChild(lbl);
    opt.onclick = () => {
      avatarPicker.querySelectorAll('.avatar-option').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      selAvatar = av.file;
      updatePreview();
    };
    avatarPicker.appendChild(opt);
  });
}

document.querySelectorAll('.gender-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selGender = btn.dataset.gender;
    selAvatar = selGender === 'female' ? 'avatar-f1.png' : 'avatar-m1.png';
    buildAvatarPicker(selGender);
    updatePreview();
  };
});

function buildAvatarEl(avatarFile, name) {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative;width:80px;flex-shrink:0;';
  const img = document.createElement('img');
  img.src = avatarFile || 'avatar-f1.png';
  img.style.cssText = 'width:80px;height:120px;object-fit:contain;object-position:center bottom;mix-blend-mode:multiply;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.6));display:block;transition:transform 0.1s;';
  img.alt = name || 'avatar';
  img.dataset.avatarImg = 'true';
  wrap.appendChild(img);
  return wrap;
}

function updatePreview() {
  const pw = document.getElementById('previewWrap');
  pw.innerHTML = '';
  pw.appendChild(buildAvatarEl(selAvatar, 'Preview'));
}

buildAvatarPicker(selGender);
updatePreview();

const nameInput = document.getElementById('nameInput');
const modal = document.getElementById('modal');
const stage = document.getElementById('stage');
const msgInput = document.getElementById('msgInput');
const myNameEl = document.getElementById('myName');

let identity = null;
const activeChars = {};

function getOrCreateChar(key, name, avatarFile) {
  if (activeChars[key]) return activeChars[key];
  const existing = stage.querySelector(`[data-key="${key}"]`);
  if (existing) stage.removeChild(existing);

  const stageW = stage.offsetWidth || window.innerWidth;
  const startX = 60 + Math.random() * (stageW - 160);

  const char = document.createElement('div');
  char.className = 'character';
  char.dataset.key = key;
  char.style.cssText = `position:absolute;bottom:0;left:${startX}px;display:flex;flex-direction:column;align-items:center;animation:float 3s ease-in-out infinite;transition:left 0ms linear;`;

  const bubble = document.createElement('div');
  bubble.className = 'char-bubble';

  const avatarWrap = buildAvatarEl(avatarFile || 'avatar-f1.png', name);
  const imgEl = avatarWrap.querySelector('img');

  const nameEl = document.createElement('div');
  nameEl.className = 'char-name';
  nameEl.textContent = name;

  const shadow = document.createElement('div');
  shadow.className = 'char-shadow';

  char.appendChild(bubble);
  char.appendChild(avatarWrap);
  char.appendChild(nameEl);
  char.appendChild(shadow);
  stage.appendChild(char);

  const charObj = {
    el: char,
    bubbleEl: bubble,
    imgEl: imgEl,
    timer: null,
    wanderTimer: null,
    currentX: startX
  };
  activeChars[key] = charObj;
  startWander(key);
  return charObj;
}

function startWander(key) {
  const ch = activeChars[key];
  if (!ch) return;

  function wander() {
    if (!activeChars[key]) return;
    const stageW = stage.offsetWidth || window.innerWidth;
    const targetX = 60 + Math.random() * (stageW - 160);
    const currentX = ch.currentX;
    const distance = Math.abs(targetX - currentX);
    const duration = Math.max(1000, distance * 6);

    // Flip sprite to face walking direction
    ch.imgEl.style.transform = targetX > currentX ? 'scaleX(1)' : 'scaleX(-1)';

    // Walk smoothly
    ch.el.style.transition = `left ${duration}ms linear`;
    ch.el.style.left = targetX + 'px';
    ch.currentX = targetX;

    // Pause then wander again
    const pause = 2000 + Math.random() * 4000;
    ch.wanderTimer = setTimeout(wander, duration + pause);
  }

  // Stagger start so not everyone moves at once
  ch.wanderTimer = setTimeout(wander, Math.random() * 4000);
}

function showMessage(key, name, text, avatarFile) {
  const ch = getOrCreateChar(key, name, avatarFile);
  ch.bubbleEl.textContent = text.slice(0, 120);
  ch.bubbleEl.classList.add('visible');
  if (ch.timer) clearTimeout(ch.timer);
  ch.timer = setTimeout(() => ch.bubbleEl.classList.remove('visible'), 7000);
}

function handleMessage(msg) {
  const slBubble = document.getElementById('bubble-sl');
  if (msg.source === 'secondlife') {
    showMessage('sl_' + msg.speaker, msg.speaker, msg.text, 'avatar-m1.png');
    slBubble.textContent = msg.speaker + ': ' + msg.text.slice(0, 80);
    slBubble.classList.add('visible');
    setTimeout(() => slBubble.classList.remove('visible'), 5000);
  } else {
    showMessage('web_' + msg.speaker, msg.speaker, msg.text, msg.avatar);
  }
}

function loadIdentity() {
  const saved = localStorage.getItem('olyesti_identity');
  if (saved) {
    identity = JSON.parse(saved);
    selGender = identity.gender || 'female';
    selAvatar = identity.avatar || 'avatar-f1.png';
    document.querySelectorAll('.gender-btn').forEach(b => {
      b.classList.toggle('selected', b.dataset.gender === selGender);
    });
    buildAvatarPicker(selGender);
    avatarPicker.querySelectorAll('.avatar-option').forEach(o => {
      o.classList.toggle('selected', o.dataset.file === selAvatar);
    });
    updatePreview();
    applyIdentity();
    modal.style.display = 'none';
  }
}

function applyIdentity() {
  myNameEl.textContent = identity.name;
  getOrCreateChar('web_' + identity.name, identity.name, identity.avatar);
}

document.getElementById('saveBtn').onclick = () => {
  const name = nameInput.value.trim();
  if (!name) { nameInput.focus(); return; }
  identity = { name, gender: selGender, avatar: selAvatar, guest: false };
  localStorage.setItem('olyesti_identity', JSON.stringify(identity));
  applyIdentity();
  modal.style.display = 'none';
};

document.getElementById('guestBtn').onclick = () => {
  const defaultAvatar = selGender === 'female' ? 'avatar-f1.png' : 'avatar-m1.png';
  identity = { name: 'Guest' + Math.floor(Math.random()*9000+1000), gender: selGender, avatar: selAvatar || defaultAvatar, guest: true };
  applyIdentity();
  modal.style.display = 'none';
};

document.getElementById('changeId').onclick = () => {
  if (identity) {
    nameInput.value = identity.guest ? '' : identity.name;
    selGender = identity.gender || 'female';
    selAvatar = identity.avatar || 'avatar-f1.png';
    document.querySelectorAll('.gender-btn').forEach(b => {
      b.classList.toggle('selected', b.dataset.gender === selGender);
    });
    buildAvatarPicker(selGender);
    avatarPicker.querySelectorAll('.avatar-option').forEach(o => {
      o.classList.toggle('selected', o.dataset.file === selAvatar);
    });
    updatePreview();
  }
  modal.style.display = 'flex';
};

const socket = io();
socket.on('history', msgs => msgs.slice(-5).forEach(m => handleMessage(m)));
socket.on('message', msg => handleMessage(msg));

socket.on('presence-init', users => {
  users.forEach(u => getOrCreateChar('web_' + u.name, u.name, u.avatar));
});

socket.on('user-joined', u => {
  getOrCreateChar('web_' + u.name, u.name, u.avatar);
});

socket.on('user-left', u => {
  const key = 'web_' + u.name;
  if (activeChars[key]) {
    clearTimeout(activeChars[key].wanderTimer);
    clearTimeout(activeChars[key].timer);
    activeChars[key].el.remove();
    delete activeChars[key];
  }
});

function send() {
  const text = msgInput.value.trim();
  if (!text || !identity) return;
  socket.emit('web-message', { name: identity.name, text, gender: identity.gender, avatar: identity.avatar });
  msgInput.value = '';
}

document.getElementById('sendBtn').onclick = send;
msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

loadIdentity();
</script>
</body>
</html>
