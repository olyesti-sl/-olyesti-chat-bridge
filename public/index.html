 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Olyesti Live Chat</title>
<script src="/socket.io/socket.io.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #050508;
  color: #e8e8e8;
  height: 100dvh;
  overflow: hidden;
  user-select: none;
}
#scene {
  position: fixed; inset: 0;
  cursor: crosshair; z-index: 1;
}
#bg {
  position: absolute; inset: 0;
  background: url('lounge.jpg') center center / cover no-repeat;
  filter: brightness(0.75);
}
#bg::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 30%, rgba(0,0,0,0.55) 100%);
}
#stage { position: absolute; inset: 0; z-index: 10; }

#chatPanel {
  position: fixed; bottom: 20px; right: 20px; width: 300px;
  z-index: 100; display: flex; flex-direction: column;
  border-radius: 14px; overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.7);
  border: 1px solid rgba(255,200,80,0.15);
}
#chatToggleBar {
  background: rgba(10,7,3,0.97);
  border-bottom: 1px solid rgba(255,200,80,0.1);
  padding: 8px 12px; display: flex; align-items: center;
  justify-content: space-between; cursor: pointer;
}
#chatToggleBar span { font-size: 0.72rem; color: #7a6a4a; letter-spacing: 0.05em; }
#chatToggleBar .ti { font-size: 0.8rem; color: #5a4a2a; transition: transform 0.2s; }
#chatPanel.collapsed .ti { transform: rotate(180deg); }
#msgLog {
  background: rgba(6,4,2,0.94); height: 200px; overflow-y: auto;
  padding: 10px 12px; display: flex; flex-direction: column;
  gap: 6px; scroll-behavior: smooth;
}
#chatPanel.collapsed #msgLog,
#chatPanel.collapsed #composeBar { display: none; }
.msg-entry { font-size: 0.78rem; line-height: 1.4; color: #c8b890; word-break: break-word; }
.msg-entry .mn { color: #e8c870; font-weight: 600; margin-right: 5px; }
.msg-entry.sl .mn { color: #80c8ff; }
.msg-entry.sys { color: #5a4a2a; font-style: italic; }
#composeBar {
  background: rgba(8,5,2,0.97); border-top: 1px solid rgba(255,200,80,0.08);
  padding: 8px 10px; display: flex; gap: 6px; align-items: center;
}
#msgInput {
  flex: 1; background: #100e08; color: #e8d8b0;
  border: 1px solid rgba(255,200,80,0.15); border-radius: 8px;
  padding: 7px 10px; font-size: 0.82rem; font-family: inherit; outline: none;
}
#msgInput:focus { border-color: rgba(255,200,80,0.4); }
#sendBtn {
  background: rgba(180,120,20,0.25); color: #d4a840;
  border: 1px solid rgba(255,200,80,0.2); border-radius: 8px;
  padding: 7px 12px; cursor: pointer; font-size: 0.8rem;
  font-family: inherit; transition: background 0.2s; white-space: nowrap;
}
#sendBtn:hover { background: rgba(180,120,20,0.45); color: #ffcc60; }

#identityBar {
  position: fixed; bottom: 20px; left: 20px; z-index: 100;
  display: flex; align-items: center; gap: 8px;
  background: rgba(8,5,2,0.9); border: 1px solid rgba(255,200,80,0.12);
  border-radius: 10px; padding: 7px 12px; font-size: 0.72rem; color: #7a6a4a;
}
#myName { color: #aa8840; }
#changeId { cursor: pointer; color: #3a3020; text-decoration: underline; font-size: 0.68rem; }
#changeId:hover { color: #aa9060; }

#moveMode {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  z-index: 200; background: rgba(10,8,20,0.85);
  border: 1px solid rgba(100,200,255,0.3); border-radius: 20px;
  padding: 5px 16px; font-size: 0.68rem; color: rgba(100,200,255,0.8);
  letter-spacing: 0.08em; pointer-events: none; opacity: 0; transition: opacity 0.3s;
}
#moveMode.active { opacity: 1; }
#standHint {
  position: fixed; top: 44px; left: 50%; transform: translateX(-50%);
  background: rgba(10,8,20,0.85); border: 1px solid rgba(255,200,80,0.2);
  border-radius: 8px; padding: 5px 14px; font-size: 0.68rem; color: #e8c870;
  z-index: 200; display: none; pointer-events: none;
}

#hud {
  position: fixed; bottom: 70px; right: 20px; z-index: 50;
  display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: 0.6;
}
.hud-row { display: flex; gap: 4px; }
.hud-key {
  width: 28px; height: 28px; background: rgba(255,200,80,0.08);
  border: 1px solid rgba(255,200,80,0.2); border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.68rem; color: #e8c870;
}
.hud-hint { font-size: 0.55rem; color: #5a4a2a; margin-top: 2px; }

#emoteBar {
  position: fixed; bottom: 70px; left: 20px; z-index: 100; display: flex; gap: 6px;
}
.emote-btn {
  width: 36px; height: 36px; background: rgba(10,8,20,0.85);
  border: 1px solid rgba(255,200,80,0.2); border-radius: 8px;
  font-size: 1.1rem; cursor: pointer; display: flex;
  align-items: center; justify-content: center; transition: background 0.15s;
}
.emote-btn:hover { background: rgba(255,200,80,0.15); }

.furniture-spot {
  position: absolute; transform: translate(-50%,-50%); z-index: 5;
  cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.furniture-ring {
  border-radius: 50%; border: 2px solid rgba(100,200,255,0.5);
  background: rgba(100,200,255,0.08); transition: all 0.2s;
  animation: ring-pulse 2s ease-in-out infinite;
}
.furniture-spot:hover .furniture-ring { border-color: rgba(100,200,255,0.9); background: rgba(100,200,255,0.2); }
.furniture-spot.occupied .furniture-ring { border-color: rgba(255,100,100,0.5); background: rgba(255,100,100,0.08); animation: none; }
.furniture-label { font-size: 0.5rem; color: rgba(100,200,255,0.7); letter-spacing: 0.05em; white-space: nowrap; text-shadow: 0 1px 4px rgba(0,0,0,1); }
.furniture-spot.occupied .furniture-label { color: rgba(255,100,100,0.6); }
@keyframes ring-pulse { 0%,100%{opacity:0.6;transform:scaleX(1)} 50%{opacity:1;transform:scaleX(1.08)} }

.character {
  position: absolute; display: flex; flex-direction: column; align-items: center;
  transform-origin: bottom center; pointer-events: none;
}
.character.seated { pointer-events: all; cursor: pointer; }
.char-bubble {
  background: rgba(10,8,20,0.92); border: 1px solid rgba(255,220,100,0.3);
  border-radius: 12px; padding: 6px 11px; font-size: 0.8rem; color: #e8d8b0;
  max-width: 180px; text-align: center; margin-bottom: 6px; opacity: 0;
  transition: opacity 0.3s; line-height: 1.4; word-break: break-word;
  position: relative; white-space: nowrap;
}
.char-bubble.visible { opacity: 1; }
.char-bubble::after {
  content: ''; position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
  border: 7px solid transparent; border-top-color: rgba(255,220,100,0.3); border-bottom: none;
}
.av-wrap { position: relative; display: flex; flex-direction: column; align-items: center; }
.av-photo { object-fit: contain; object-position: center bottom; display: block; transform-origin: bottom center; }
.av-item { position: absolute; right: -8px; bottom: 35%; font-size: 1.4em; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); opacity: 0; transition: opacity 0.3s; }
.av-item.visible { opacity: 1; }
.av-limbs { position: absolute; bottom: 0; left: 0; right: 0; height: 100%; pointer-events: none; }
.av-arm-l { position:absolute; width:9px; height:36px; background:rgba(255,255,255,0.07); border-radius:5px; bottom:36%; left:6%; transform-origin:top center; animation:arm-idle-l 2.5s ease-in-out infinite; }
.av-arm-r { position:absolute; width:9px; height:36px; background:rgba(255,255,255,0.07); border-radius:5px; bottom:36%; right:6%; transform-origin:top center; animation:arm-idle-r 2.5s ease-in-out infinite; }
.av-leg-l { position:absolute; width:12px; height:30px; background:rgba(255,255,255,0.05); border-radius:5px; bottom:2%; left:26%; transform-origin:top center; animation:leg-idle 2.5s ease-in-out infinite; }
.av-leg-r { position:absolute; width:12px; height:30px; background:rgba(255,255,255,0.05); border-radius:5px; bottom:2%; right:26%; transform-origin:top center; animation:leg-idle 2.5s ease-in-out infinite 0.3s; }
.char-name { font-size:0.62rem; color:rgba(255,220,140,0.85); margin-top:3px; letter-spacing:0.06em; white-space:nowrap; text-shadow:0 1px 6px rgba(0,0,0,1); }
.char-shadow { border-radius:50%; background:rgba(0,0,0,0.5); filter:blur(5px); margin-top:2px; }

@keyframes arm-idle-l{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-14deg)}}
@keyframes arm-idle-r{0%,100%{transform:rotate(8deg)}50%{transform:rotate(14deg)}}
@keyframes leg-idle{0%,100%{transform:rotate(0deg)}50%{transform:rotate(2deg)}}
@keyframes arm-walk-l{0%,100%{transform:rotate(-32deg)}50%{transform:rotate(32deg)}}
@keyframes arm-walk-r{0%,100%{transform:rotate(32deg)}50%{transform:rotate(-32deg)}}
@keyframes leg-walk-l{0%,100%{transform:rotate(-28deg)}50%{transform:rotate(28deg)}}
@keyframes leg-walk-r{0%,100%{transform:rotate(28deg)}50%{transform:rotate(-28deg)}}
@keyframes av-talk{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.04)}}
@keyframes arm-wave{0%,100%{transform:rotate(-10deg)}25%{transform:rotate(-85deg)}75%{transform:rotate(-55deg)}}
@keyframes av-dance{0%,100%{transform:rotate(0deg) translateY(0)}25%{transform:rotate(-6deg) translateY(-9px)}75%{transform:rotate(6deg) translateY(-9px)}}
@keyframes av-sit{0%{transform:scaleY(1) translateY(0)}100%{transform:scaleY(0.72) translateY(8px)}}
@keyframes leg-sit-l{0%,100%{transform:rotate(70deg)}}
@keyframes leg-sit-r{0%,100%{transform:rotate(-70deg)}}
@keyframes arm-sit-l{0%,100%{transform:rotate(-30deg)}}
@keyframes arm-sit-r{0%,100%{transform:rotate(30deg)}}
@keyframes arm-sip{0%,100%{transform:rotate(30deg)}40%,60%{transform:rotate(-60deg)}}

#modal { position:fixed; inset:0; background:rgba(0,0,0,0.92); display:flex; align-items:center; justify-content:center; z-index:500; overflow-y:auto; padding:20px; }
#modalBox { background:#0d0a06; border:1px solid rgba(255,200,80,0.15); border-radius:16px; padding:24px 20px; width:360px; display:flex; flex-direction:column; gap:14px; }
#modalBox h2 { font-size:1.1rem; color:#e8c870; }
#nameInput { background:#100e08; color:#e8d8b0; border:1px solid rgba(255,200,80,0.2); border-radius:8px; padding:10px 12px; font-size:0.9rem; font-family:inherit; width:100%; outline:none; }
.picker-label { font-size:0.72rem; color:#7a6a4a; margin-bottom:6px; }
.gender-row { display:flex; gap:8px; }
.gender-btn { flex:1; padding:8px; border-radius:8px; cursor:pointer; font-family:inherit; font-size:0.85rem; background:#100e08; color:#7a6a4a; border:2px solid transparent; transition:all 0.15s; }
.gender-btn.selected { border-color:rgba(255,200,80,0.4); color:#e8c870; background:#1a1408; }
.avatar-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-height:260px; overflow-y:auto; }
.avatar-option { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; padding:6px 4px; border-radius:8px; border:2px solid transparent; transition:all 0.15s; background:#1a1a1a; }
.avatar-option:hover { border-color:rgba(255,200,80,0.2); }
.avatar-option.selected { border-color:#e8c870; background:#1a1408; }
.avatar-option img { width:48px; height:72px; object-fit:contain; object-position:center bottom; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
.avatar-option span { font-size:0.55rem; color:#7a6a4a; text-align:center; line-height:1.2; }
#previewWrap { display:flex; justify-content:center; padding:8px 0; }
#previewWrap img { width:80px; height:120px; object-fit:contain; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.6)); }
.modal-btns { display:flex; gap:8px; }
.modal-btns button { flex:1; padding:10px; border-radius:8px; cursor:pointer; font-family:inherit; font-size:0.85rem; }
#guestBtn { background:#100e08; color:#7a6a4a; border:1px solid rgba(255,200,80,0.1); }
#saveBtn { background:rgba(180,120,20,0.3); color:#e8c870; border:1px solid rgba(255,200,80,0.25); }
#guestBtn:hover { background:#181408; }
#saveBtn:hover { background:rgba(180,120,20,0.5); }
</style>
</head>
<body>

<div id="modal">
  <div id="modalBox">
    <h2>Welcome to Olyesti</h2>
    <input id="nameInput" type="text" placeholder="Your display name" maxlength="32" />
    <div>
      <div class="picker-label">Gender</div>
      <div class="gender-row">
        <button class="gender-btn selected" data-gender="female">♀ Female</button>
        <button class="gender-btn" data-gender="male">♂ Male</button>
      </div>
    </div>
    <div>
      <div class="picker-label">Choose your avatar</div>
      <div class="avatar-grid" id="avatarPicker"></div>
    </div>
    <div id="previewWrap"></div>
    <div class="modal-btns">
      <button id="guestBtn">Join as Guest</button>
      <button id="saveBtn">Save & Enter</button>
    </div>
  </div>
</div>

<div id="scene">
  <div id="bg"></div>
  <div id="furnitureLayer"></div>
  <div id="stage"></div>
</div>

<div id="moveMode">🕹 MOVE MODE — WASD or click floor</div>
<div id="standHint">Press Space or click yourself to stand up</div>

<div id="hud">
  <div class="hud-row"><div class="hud-key">W</div></div>
  <div class="hud-row">
    <div class="hud-key">A</div>
    <div class="hud-key">S</div>
    <div class="hud-key">D</div>
  </div>
  <div class="hud-hint">click room first</div>
</div>

<div id="emoteBar">
  <button class="emote-btn" data-emote="wave">👋</button>
  <button class="emote-btn" data-emote="dance">💃</button>
  <button class="emote-btn" data-emote="sit">🪑</button>
  <button class="emote-btn" data-emote="coffee">☕</button>
</div>

<div id="identityBar">
  <span id="myName">Not joined</span>
  <span id="changeId">change</span>
</div>

<div id="chatPanel">
  <div id="chatToggleBar">
    <span>💬 OLYESTI CHAT</span>
    <span class="ti">▲</span>
  </div>
  <div id="msgLog"></div>
  <div id="composeBar">
    <input id="msgInput" type="text" placeholder="Type here…" maxlength="300" />
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
const FURNITURE=[
  {id:'sofa-l',label:'Sofa',x:14,y:72,action:'sit'},
  {id:'sofa-r',label:'Sofa',x:86,y:72,action:'sit'},
  {id:'chair-fl',label:'Chair',x:22,y:62,action:'sit'},
  {id:'chair-fr',label:'Chair',x:78,y:62,action:'sit'},
  {id:'chair-bl',label:'Chair',x:30,y:52,action:'sit'},
  {id:'chair-br',label:'Chair',x:70,y:52,action:'sit'},
  {id:'bar-l',label:'Bar Stool',x:44,y:55,action:'sit'},
  {id:'bar-r',label:'Bar Stool',x:56,y:55,action:'sit'},
  {id:'coffee',label:'☕ Coffee',x:50,y:50,action:'coffee'},
];
const seatOccupants={};

const FEMALE_AVATARS=[
  {file:'avatar-f1.png',label:'Hispanic'},{file:'avatar-f2.png',label:'Black'},
  {file:'avatar-f3.png',label:'White'},{file:'avatar-f4.png',label:'Asian'},
  {file:'avatar-f5.png',label:'Hispanic 50+'},{file:'avatar-f6.png',label:'Black 50+'},
  {file:'avatar-f7.png',label:'White 50+'},{file:'avatar-f8.png',label:'Asian 50+'},
];
const MALE_AVATARS=[
  {file:'avatar-m1.png',label:'Hispanic'},{file:'avatar-m2.png',label:'Black'},
  {file:'avatar-m3.png',label:'White'},{file:'avatar-m4.png',label:'Asian'},
  {file:'avatar-m5.png',label:'Hispanic 50+'},{file:'avatar-m6.png',label:'Black 50+'},
  {file:'avatar-m7.png',label:'White 50+'},{file:'avatar-m8.png',label:'Asian 50+'},
];
let selGender='female',selAvatar='avatar-f1.png';

const avatarPicker=document.getElementById('avatarPicker');
function buildAvatarPicker(gender){
  avatarPicker.innerHTML='';
  (gender==='female'?FEMALE_AVATARS:MALE_AVATARS).forEach(av=>{
    const opt=document.createElement('div');
    opt.className='avatar-option'+(av.file===selAvatar?' selected':'');
    opt.dataset.file=av.file;
    const img=document.createElement('img');img.src=av.file;img.alt=av.label;
    const lbl=document.createElement('span');lbl.textContent=av.label;
    opt.appendChild(img);opt.appendChild(lbl);
    opt.onclick=()=>{
      avatarPicker.querySelectorAll('.avatar-option').forEach(o=>o.classList.remove('selected'));
      opt.classList.add('selected');selAvatar=av.file;updatePreview();
    };
    avatarPicker.appendChild(opt);
  });
}
document.querySelectorAll('.gender-btn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.gender-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');selGender=btn.dataset.gender;
    selAvatar=selGender==='female'?'avatar-f1.png':'avatar-m1.png';
    buildAvatarPicker(selGender);updatePreview();
  };
});
function updatePreview(){
  const pw=document.getElementById('previewWrap');pw.innerHTML='';
  const img=document.createElement('img');img.src=selAvatar;img.alt='Preview';
  img.style.cssText='width:80px;height:120px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.6));';
  pw.appendChild(img);
}
buildAvatarPicker(selGender);updatePreview();

let moveModeActive=false;
const moveModeEl=document.getElementById('moveMode');
function enterMoveMode(){moveModeActive=true;moveModeEl.classList.add('active');}
function exitMoveMode(){
  moveModeActive=false;moveModeEl.classList.remove('active');
  Object.keys(keys).forEach(k=>keys[k]=false);
  if(moveLoop){clearInterval(moveLoop);moveLoop=null;}
  const ch=activeChars[myKey];if(ch&&ch.state==='walk')setIdle(ch);
}

document.getElementById('scene').addEventListener('mousedown',()=>{if(!moveModeActive)enterMoveMode();});
document.getElementById('chatPanel').addEventListener('mousedown',e=>{e.stopPropagation();if(moveModeActive)exitMoveMode();});
document.getElementById('identityBar').addEventListener('mousedown',e=>{e.stopPropagation();if(moveModeActive)exitMoveMode();});
document.getElementById('emoteBar').addEventListener('mousedown',e=>{e.stopPropagation();});
document.getElementById('chatToggleBar').addEventListener('click',()=>{document.getElementById('chatPanel').classList.toggle('collapsed');});

const stage=document.getElementById('stage');
const furnitureLayer=document.getElementById('furnitureLayer');

function project(x,y){
  const sw=stage.offsetWidth||window.innerWidth;
  const sh=stage.offsetHeight||window.innerHeight;
  const screenYpct=0.65+(y/100)*0.27;
  const screenY=sh*screenYpct;
  const depthT=0.15+(y/100)*0.85;
  const screenX=sw*0.5+(x-50)/50*(sw*0.44)*depthT;
  const scale=0.22+(y/100)*0.78;
  const bright=0.45+(y/100)*0.55;
  const zIndex=Math.round(y*10);
  return{screenX,screenY,scale,bright,zIndex};
}

function renderFurniture(){
  furnitureLayer.innerHTML='';
  furnitureLayer.style.cssText='position:absolute;inset:0;z-index:6;pointer-events:none;';
  FURNITURE.forEach(f=>{
    const{screenX,screenY,scale}=project(f.x,f.y);
    const spot=document.createElement('div');
    spot.className='furniture-spot';spot.dataset.id=f.id;
    spot.style.left=screenX+'px';spot.style.top=screenY+'px';
    spot.style.pointerEvents='all';
    const ring=document.createElement('div');ring.className='furniture-ring';
    ring.style.width=Math.max(24,44*scale)+'px';
    ring.style.height=Math.max(8,16*scale)+'px';
    const label=document.createElement('div');label.className='furniture-label';
    label.textContent=f.label;
    spot.appendChild(ring);spot.appendChild(label);
    spot.onclick=()=>handleFurnitureClick(f);
    furnitureLayer.appendChild(spot);
  });
  updateFurnitureOccupancy();
}

function updateFurnitureOccupancy(){
  document.querySelectorAll('.furniture-spot').forEach(spot=>{
    const id=spot.dataset.id;
    const occupied=!!seatOccupants[id];
    spot.classList.toggle('occupied',occupied);
    const label=spot.querySelector('.furniture-label');
    if(label){const f=FURNITURE.find(f=>f.id===id);label.textContent=occupied?seatOccupants[id]:f.label;}
  });
}

function buildCharEl(name,avatarFile){
  const char=document.createElement('div');char.className='character';
  const bubble=document.createElement('div');bubble.className='char-bubble';
  const avWrap=document.createElement('div');avWrap.className='av-wrap';
  const photo=document.createElement('img');photo.className='av-photo';
  photo.src=avatarFile||'avatar-f1.png';photo.alt=name;
  const item=document.createElement('div');item.className='av-item';
  const limbs=document.createElement('div');limbs.className='av-limbs';
  limbs.innerHTML='<div class="av-arm-l"></div><div class="av-arm-r"></div><div class="av-leg-l"></div><div class="av-leg-r"></div>';
  avWrap.appendChild(photo);avWrap.appendChild(item);avWrap.appendChild(limbs);
  const nameEl=document.createElement('div');nameEl.className='char-name';nameEl.textContent=name;
  const shadow=document.createElement('div');shadow.className='char-shadow';
  char.appendChild(bubble);char.appendChild(avWrap);char.appendChild(nameEl);char.appendChild(shadow);
  return{char,bubble,photo,item,limbs,nameEl,shadow};
}

function applyDepth(ch){
  const{screenX,screenY,scale,bright,zIndex}=project(ch.x,ch.y);
  const h=150*scale,w=h*0.58;
  ch.char.style.position='absolute';
  ch.char.style.left=screenX+'px';
  ch.char.style.top=screenY+'px';
  ch.char.style.bottom='auto';
  ch.char.style.transform='translateX(-50%)';
  ch.char.style.zIndex=zIndex;
  ch.char.style.marginTop=`-${h+24}px`;
  ch.photo.style.width=w+'px';ch.photo.style.height=h+'px';
  ch.photo.style.filter=`drop-shadow(0 4px 14px rgba(0,0,0,0.8)) brightness(${bright})`;
  ch.shadow.style.width=(w*0.75)+'px';
  ch.shadow.style.height=Math.max(3,7*scale)+'px';
}

function getLimbs(ch){
  return{
    armL:ch.limbs.querySelector('.av-arm-l'),armR:ch.limbs.querySelector('.av-arm-r'),
    legL:ch.limbs.querySelector('.av-leg-l'),legR:ch.limbs.querySelector('.av-leg-r'),
  };
}
function setIdle(ch){
  const{armL,armR,legL,legR}=getLimbs(ch);
  ch.photo.style.animation='';
  armL.style.animation='arm-idle-l 2.5s ease-in-out infinite';
  armR.style.animation='arm-idle-r 2.5s ease-in-out infinite';
  legL.style.animation='leg-idle 2.5s ease-in-out infinite';
  legR.style.animation='leg-idle 2.5s ease-in-out infinite 0.3s';
  ch.state='idle';
}
function setWalk(ch,goRight){
  const{armL,armR,legL,legR}=getLimbs(ch);
  armL.style.animation='arm-walk-l 0.42s ease-in-out infinite';
  armR.style.animation='arm-walk-r 0.42s ease-in-out infinite';
  legL.style.animation='leg-walk-l 0.42s ease-in-out infinite';
  legR.style.animation='leg-walk-r 0.42s ease-in-out infinite 0.21s';
  ch.photo.style.transform=goRight?'scaleX(1)':'scaleX(-1)';ch.state='walk';
}
function setTalk(ch){ch.photo.style.animation='av-talk 0.4s ease-in-out infinite';ch.state='talk';}
function setWave(ch){getLimbs(ch).armR.style.animation='arm-wave 0.5s ease-in-out infinite';ch.state='wave';}
function setDance(ch){
  const{armL,armR}=getLimbs(ch);
  ch.photo.style.animation='av-dance 0.5s ease-in-out infinite';
  armL.style.animation='arm-walk-l 0.5s ease-in-out infinite';
  armR.style.animation='arm-walk-r 0.5s ease-in-out infinite';ch.state='dance';
}
function setSit(ch){
  const{armL,armR,legL,legR}=getLimbs(ch);
  ch.photo.style.animation='av-sit 0.4s ease-out forwards';
  armL.style.animation='arm-sit-l 0s forwards';armR.style.animation='arm-sit-r 0s forwards';
  legL.style.animation='leg-sit-l 0s forwards';legR.style.animation='leg-sit-r 0s forwards';
  ch.char.classList.add('seated');ch.state='sit';
}
function setSip(ch){
  getLimbs(ch).armR.style.animation='arm-sip 1.2s ease-in-out 3';
  ch.item.textContent='☕';ch.item.classList.add('visible');ch.state='sip';
  setTimeout(()=>{if(ch.state==='sip'){ch.item.classList.remove('visible');setSit(ch);}},3800);
}

const activeChars={};
function getOrCreateChar(key,name,avatarFile,startX,startY){
  if(activeChars[key])return activeChars[key];
  const els=buildCharEl(name,avatarFile);stage.appendChild(els.char);
  const ch={...els,x:startX??50,y:startY??50,targetX:startX??50,targetY:startY??50,
    state:'idle',seat:null,timer:null,talkTimer:null,wanderTimer:null,moveInterval:null};
  activeChars[key]=ch;applyDepth(ch);setIdle(ch);return ch;
}
function removeChar(key){
  const ch=activeChars[key];if(!ch)return;
  clearTimeout(ch.timer);clearTimeout(ch.talkTimer);
  clearTimeout(ch.wanderTimer);clearInterval(ch.moveInterval);
  ch.char.remove();delete activeChars[key];
}

const MOVE_SPEED=0.35;
function startMoving(key,onArrive){
  const ch=activeChars[key];if(!ch)return;
  if(ch.moveInterval)clearInterval(ch.moveInterval);
  ch.moveInterval=setInterval(()=>{
    if(!activeChars[key]){clearInterval(ch.moveInterval);return;}
    const dx=ch.targetX-ch.x,dy=ch.targetY-ch.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<MOVE_SPEED){
      ch.x=ch.targetX;ch.y=ch.targetY;applyDepth(ch);
      clearInterval(ch.moveInterval);ch.moveInterval=null;
      if(onArrive)onArrive();else if(ch.state==='walk')setIdle(ch);
      return;
    }
    const goRight=dx>0;
    if(ch.state!=='walk')setWalk(ch,goRight);
    else ch.photo.style.transform=goRight?'scaleX(1)':'scaleX(-1)';
    ch.x+=(dx/dist)*MOVE_SPEED;ch.y+=(dy/dist)*MOVE_SPEED;applyDepth(ch);
  },16);
}

function handleFurnitureClick(f){
  if(!myKey||!activeChars[myKey])return;
  const ch=activeChars[myKey];
  if(ch.seat)standUp();
  if(seatOccupants[f.id]&&seatOccupants[f.id]!==identity.name){showToast(seatOccupants[f.id]+' is sitting there');return;}
  ch.targetX=f.x;ch.targetY=f.y;
  startMoving(myKey,()=>{f.action==='sit'?doSit(f.id,f.x,f.y):doCoffee(f.x,f.y);});
}
function doSit(seatId,x,y){
  const ch=activeChars[myKey];if(!ch)return;
  ch.seat=seatId;setSit(ch);
  document.getElementById('standHint').style.display='block';
  socket.emit('sit',{seatId,x,y});
}
function doCoffee(x,y){
  const ch=activeChars[myKey];if(!ch)return;
  ch.seat='coffee';setSip(ch);
  document.getElementById('standHint').style.display='block';
  socket.emit('sit',{seatId:'coffee',x,y});
  setTimeout(()=>{if(ch.seat==='coffee')standUp();},5000);
}
function standUp(){
  const ch=activeChars[myKey];if(!ch||!ch.seat)return;
  ch.seat=null;ch.char.classList.remove('seated');ch.item.classList.remove('visible');
  setIdle(ch);document.getElementById('standHint').style.display='none';
  socket.emit('stand');
}

function showToast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';
    t.style.cssText='position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(10,8,20,0.9);border:1px solid rgba(255,200,80,0.2);border-radius:8px;padding:8px 16px;font-size:0.78rem;color:#e8c870;z-index:300;pointer-events:none;transition:opacity 0.3s;';
    document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(t._timer);t._timer=setTimeout(()=>t.style.opacity='0',2500);
}

const keys={};let myKey=null,moveLoop=null;
const PLAYER_SPEED=0.55;

document.addEventListener('keydown',e=>{
  if(!myKey||!moveModeActive)return;
  if(e.key===' '){e.preventDefault();const ch=activeChars[myKey];if(ch&&ch.seat){standUp();return;}}
  const ch=activeChars[myKey];if(ch&&ch.seat)return;
  if(['w','a','s','d'].includes(e.key.toLowerCase())){
    e.preventDefault();keys[e.key.toLowerCase()]=true;
    if(!moveLoop)startPlayerLoop();
  }
});
document.addEventListener('keyup',e=>{
  keys[e.key.toLowerCase()]=false;
  if(!keys.w&&!keys.a&&!keys.s&&!keys.d){
    if(moveLoop){clearInterval(moveLoop);moveLoop=null;}
    const ch=activeChars[myKey];if(ch&&ch.state==='walk')setIdle(ch);
  }
});
function startPlayerLoop(){
  moveLoop=setInterval(()=>{
    const ch=activeChars[myKey];if(!ch||ch.seat)return;
    let dx=0,dy=0;
    if(keys.a)dx-=PLAYER_SPEED;if(keys.d)dx+=PLAYER_SPEED;
    if(keys.w)dy-=PLAYER_SPEED;if(keys.s)dy+=PLAYER_SPEED;
    if(dx===0&&dy===0)return;
    const newX=Math.max(2,Math.min(98,ch.x+dx));
    const newY=Math.max(5,Math.min(95,ch.y+dy));
    if(newX!==ch.x||newY!==ch.y){
      if(ch.state!=='walk')setWalk(ch,dx>=0);
      else if(dx!==0)ch.photo.style.transform=dx>0?'scaleX(1)':'scaleX(-1)';
      ch.x=newX;ch.y=newY;applyDepth(ch);
      socket.emit('position',{x:ch.x,y:ch.y});
    }
  },16);
}

document.getElementById('scene').addEventListener('click',e=>{
  if(!myKey||!activeChars[myKey])return;
  if(e.target.closest('.furniture-spot'))return;
  const ch=activeChars[myKey];
  if(ch.seat&&e.target.closest('.character.seated')){standUp();return;}
  if(ch.seat)return;
  const rect=stage.getBoundingClientRect();
  const clickX=e.clientX-rect.left,clickY=e.clientY-rect.top;
  const sw=stage.offsetWidth,sh=stage.offsetHeight;
  const rawY=((clickY/sh)-0.65)/0.27*100;
  const clampedY=Math.max(5,Math.min(95,rawY));
  const depthT=0.15+(clampedY/100)*0.85;
  const rawX=50+((clickX-sw*0.5)/(sw*0.44*depthT))*50;
  const clampedX=Math.max(2,Math.min(98,rawX));
  ch.targetX=clampedX;ch.targetY=clampedY;startMoving(myKey);
});

document.querySelectorAll('.emote-btn').forEach(btn=>{
  btn.onclick=()=>{
    if(!myKey||!activeChars[myKey])return;
    const ch=activeChars[myKey];const emote=btn.dataset.emote;
    if(emote==='wave'){setWave(ch);setTimeout(()=>setIdle(ch),3000);}
    if(emote==='dance'){setDance(ch);setTimeout(()=>setIdle(ch),5000);}
    if(emote==='sit'){if(ch.seat){standUp();return;}doSit('emote-sit',ch.x,ch.y);}
    if(emote==='coffee'){handleFurnitureClick(FURNITURE.find(f=>f.id==='coffee'));}
  };
});

function startWander(key){
  const ch=activeChars[key];if(!ch)return;
  function wander(){
    if(!activeChars[key])return;
    if(activeChars[key].seat){activeChars[key].wanderTimer=setTimeout(wander,3000);return;}
    ch.targetX=10+Math.random()*80;ch.targetY=15+Math.random()*70;
    startMoving(key);ch.wanderTimer=setTimeout(wander,4000+Math.random()*5000);
  }
  ch.wanderTimer=setTimeout(wander,Math.random()*3000);
}

const msgLog=document.getElementById('msgLog');
function addToLog(name,text,cls=''){
  const entry=document.createElement('div');
  entry.className='msg-entry'+(cls?' '+cls:'');
  const nameSpan=document.createElement('span');
  nameSpan.className='mn';nameSpan.textContent=name+':';
  entry.appendChild(nameSpan);
  entry.appendChild(document.createTextNode(text));
  msgLog.appendChild(entry);
  msgLog.scrollTop=msgLog.scrollHeight;
}

function showMessage(key,name,text,avatarFile,x,y){
  const ch=getOrCreateChar(key,name,avatarFile,x,y);
  ch.bubble.textContent=text.slice(0,120);ch.bubble.classList.add('visible');
  setTalk(ch);
  if(ch.talkTimer)clearTimeout(ch.talkTimer);
  ch.talkTimer=setTimeout(()=>{if(activeChars[key])setIdle(ch);},7000);
  if(ch.timer)clearTimeout(ch.timer);
  ch.timer=setTimeout(()=>ch.bubble.classList.remove('visible'),7000);
}
function handleMessage(msg){
  if(msg.source==='secondlife'){
    addToLog(msg.speaker,msg.text,'sl');
    showMessage('sl_'+msg.speaker,msg.speaker,msg.text,'avatar-m1.png',8,55);
  }else{
    addToLog(msg.speaker,msg.text);
    showMessage('web_'+msg.speaker,msg.speaker,msg.text,msg.avatar,msg.x||50,msg.y||70);
  }
}

const nameInput=document.getElementById('nameInput');
const modal=document.getElementById('modal');
const msgInput=document.getElementById('msgInput');
const myNameEl=document.getElementById('myName');
let identity=null;

function applyIdentity(){
  myNameEl.textContent=identity.name;myKey='web_'+identity.name;
  getOrCreateChar(myKey,identity.name,identity.avatar,50,82);
  socket.emit('user-join',{name:identity.name,avatar:identity.avatar,gender:identity.gender,x:50,y:82});
  addToLog('System','You joined as '+identity.name,'sys');
}
document.getElementById('saveBtn').onclick=()=>{
  const name=nameInput.value.trim();if(!name){nameInput.focus();return;}
  identity={name,gender:selGender,avatar:selAvatar,guest:false};
  localStorage.setItem('olyesti_identity',JSON.stringify(identity));
  applyIdentity();modal.style.display='none';
};
document.getElementById('guestBtn').onclick=()=>{
  const def=selGender==='female'?'avatar-f1.png':'avatar-m1.png';
  identity={name:'Guest'+Math.floor(Math.random()*9000+1000),gender:selGender,avatar:selAvatar||def,guest:true};
  applyIdentity();modal.style.display='none';
};
document.getElementById('changeId').onclick=()=>{
  if(identity){
    nameInput.value=identity.guest?'':identity.name;
    selGender=identity.gender||'female';selAvatar=identity.avatar||'avatar-f1.png';
    document.querySelectorAll('.gender-btn').forEach(b=>b.classList.toggle('selected',b.dataset.gender===selGender));
    buildAvatarPicker(selGender);
    avatarPicker.querySelectorAll('.avatar-option').forEach(o=>o.classList.toggle('selected',o.dataset.file===selAvatar));
    updatePreview();
  }
  modal.style.display='flex';
};
function loadIdentity(){
  const saved=localStorage.getItem('olyesti_identity');
  if(saved){
    identity=JSON.parse(saved);selGender=identity.gender||'female';selAvatar=identity.avatar||'avatar-f1.png';
    document.querySelectorAll('.gender-btn').forEach(b=>b.classList.toggle('selected',b.dataset.gender===selGender));
    buildAvatarPicker(selGender);
    avatarPicker.querySelectorAll('.avatar-option').forEach(o=>o.classList.toggle('selected',o.dataset.file===selAvatar));
    updatePreview();applyIdentity();modal.style.display='none';
  }
}

const socket=io();
socket.on('history',msgs=>msgs.slice(-5).forEach(m=>handleMessage(m)));
socket.on('message',msg=>handleMessage(msg));
socket.on('seats-init',data=>{Object.assign(seatOccupants,data);updateFurnitureOccupancy();});
socket.on('seat-update',({seatId,occupant})=>{if(occupant)seatOccupants[seatId]=occupant;else delete seatOccupants[seatId];updateFurnitureOccupancy();});
socket.on('presence-init',users=>{users.forEach(u=>{const key='web_'+u.name;if(key===myKey)return;getOrCreateChar(key,u.name,u.avatar,u.x||50,u.y||50);startWander(key);});});
socket.on('user-joined',u=>{const key='web_'+u.name;if(key===myKey)return;getOrCreateChar(key,u.name,u.avatar,u.x||50,u.y||50);startWander(key);addToLog('System',u.name+' joined','sys');});
socket.on('user-moved',u=>{const key='web_'+u.name;if(key===myKey)return;const ch=activeChars[key];if(!ch)return;clearTimeout(ch.wanderTimer);ch.targetX=u.x;ch.targetY=u.y;startMoving(key);});
socket.on('user-sat',u=>{const key='web_'+u.name;if(key===myKey)return;const ch=activeChars[key];if(!ch)return;ch.seat=u.seatId;ch.targetX=u.x;ch.targetY=u.y;startMoving(key,()=>setSit(ch));});
socket.on('user-stood',u=>{const key='web_'+u.name;if(key===myKey)return;const ch=activeChars[key];if(!ch)return;ch.seat=null;ch.char.classList.remove('seated');ch.item.classList.remove('visible');setIdle(ch);});
socket.on('user-left',u=>{addToLog('System',u.name+' left','sys');removeChar('web_'+u.name);});

function send(){
  const text=msgInput.value.trim();if(!text||!identity)return;
  socket.emit('web-message',{name:identity.name,text,gender:identity.gender,avatar:identity.avatar});
  msgInput.value='';
}
document.getElementById('sendBtn').onclick=send;
msgInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});

window.addEventListener('resize',()=>{renderFurniture();Object.values(activeChars).forEach(ch=>applyDepth(ch));});

renderFurniture();
loadIdentity();
</script>
