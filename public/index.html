<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Olyesti Cafe — Live Lounge</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Georgia', serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── LOGIN SCREEN ── */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
      background: radial-gradient(ellipse at center, #1a1200 0%, #0a0a0a 70%);
    }

    #login-screen h1 {
      color: #c9a84c;
      font-size: 2rem;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    #login-screen p {
      color: #888;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    #email-input {
      padding: 12px 16px;
      border-radius: 6px;
      border: 1px solid #c9a84c;
      background: #111;
      color: #fff;
      width: 280px;
      font-size: 1rem;
      outline: none;
    }

    #name-input {
      padding: 12px 16px;
      border-radius: 6px;
      border: 1px solid #c9a84c;
      background: #111;
      color: #fff;
      width: 280px;
      font-size: 1rem;
      outline: none;
    }

    .gold-btn {
      background: #c9a84c;
      color: #000;
      padding: 12px 32px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      letter-spacing: 1px;
      transition: background 0.2s;
    }

    .gold-btn:hover { background: #e0c060; }

    #login-msg {
      color: #c9a84c;
      font-size: 0.85rem;
      min-height: 20px;
    }

    /* ── NAME PROMPT (shown after magic link click) ── */
    #name-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
      background: radial-gradient(ellipse at center, #1a1200 0%, #0a0a0a 70%);
    }

    #name-screen h2 {
      color: #c9a84c;
      font-size: 1.5rem;
      letter-spacing: 2px;
    }

    /* ── LOUNGE ── */
    #lounge {
      display: none;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top bar */
    #topbar {
      background: #111;
      border-bottom: 1px solid #2a2a2a;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    #topbar .logo {
      color: #c9a84c;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #topbar .viewer-count {
      color: #888;
      font-size: 0.8rem;
    }

    /* Main layout */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left: TV + audience */
    #stage {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 12px;
      gap: 10px;
      overflow: hidden;
    }

    /* TV screen embed */
    #tv-frame {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border: 2px solid #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    #tv-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Audience row */
    #audience-section {
      flex-shrink: 0;
    }

    #audience-label {
      color: #555;
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    #audience-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
      min-height: 90px;
    }

    .seat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #c9a84c;
      object-fit: cover;
      background: #222;
    }

    .chair {
      width: 52px;
      height: 14px;
      background: #5a3e2b;
      border-radius: 4px 4px 0 0;
      box-shadow: 0 4px 0 #3d2a1a;
    }

    .viewer-label {
      font-size: 9px;
      color: #c9a84c;
      text-align: center;
      max-width: 56px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      margin-top: 4px;
    }

    /* Right: Chat */
    #chat-panel {
      width: 300px;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #1e1e1e;
      background: #0d0d0d;
      overflow: hidden;
    }

    #chat-header {
      padding: 10px 14px;
      border-bottom: 1px solid #1e1e1e;
      color: #c9a84c;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: #2a2a2a #0d0d0d;
    }

    #chat-messages::-webkit-scrollbar { width: 4px; }
    #chat-messages::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }

    .chat-msg {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .chat-msg img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid #c9a84c;
      flex-shrink: 0;
    }

    .chat-msg-body {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .chat-msg-name {
      font-size: 0.7rem;
      color: #c9a84c;
      font-weight: bold;
    }

    .chat-msg-text {
      font-size: 0.85rem;
      color: #ddd;
      line-height: 1.4;
      word-break: break-word;
    }

    /* Chat input — NEVER clipped */
    #chat-input-area {
      flex-shrink: 0;
      padding: 10px;
      border-top: 1px solid #1e1e1e;
      display: flex;
      gap: 8px;
      background: #0d0d0d;
    }

    #chat-input {
      flex: 1;
      padding: 9px 12px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      resize: none;
      font-family: inherit;
    }

    #chat-input:focus { border-color: #c9a84c; }

    #send-btn {
      background: #c9a84c;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 1rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    #send-btn:hover { background: #e0c060; }
  </style>
</head>
<body>

<!-- ══ LOGIN SCREEN ══ -->
<div id="login-screen">
  <h1>☕ Olyesti Cafe</h1>
  <p>Enter your email to join the lounge</p>
  <input id="email-input" type="email" placeholder="your@email.com" />
  <button class="gold-btn" onclick="loginWithEmail()">Enter the Lounge</button>
  <span id="login-msg"></span>
</div>

<!-- ══ NAME SCREEN (after magic link) ══ -->
<div id="name-screen">
  <h2>Welcome to the Lounge</h2>
  <p style="color:#888; font-size:0.85rem;">Choose your display name</p>
  <input id="name-input" type="text" placeholder="Your name..." maxlength="24" />
  <button class="gold-btn" onclick="saveName()">Take My Seat</button>
</div>

<!-- ══ LOUNGE ══ -->
<div id="lounge">

  <!-- Top bar -->
  <div id="topbar">
    <span class="logo">☕ Olyesti Cafe</span>
    <span class="viewer-count" id="viewer-count">0 in the lounge</span>
  </div>

  <!-- Main -->
  <div id="main">

    <!-- Stage: TV + Audience -->
    <div id="stage">

      <!-- TV -->
      <div id="tv-frame">
        <!-- Replace with your Twitch/YouTube embed -->
        <iframe
          src="https://player.twitch.tv/?channel=olyesti&parent=chat.olyesti.com"
          allowfullscreen>
        </iframe>
      </div>

      <!-- Audience -->
      <div id="audience-section">
        <div id="audience-label">Now Watching</div>
        <div id="audience-row"></div>
      </div>

    </div>

    <!-- Chat Panel -->
    <div id="chat-panel">
      <div id="chat-header">💬 Lounge Chat</div>
      <div id="chat-messages"></div>
      <div id="chat-input-area">
        <textarea id="chat-input" rows="1" placeholder="Say something..."></textarea>
        <button id="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>

  </div>
</div>

<script>
  // ══════════════════════════════════════════
  // CONFIGURATION — replace these two values
  // ══════════════════════════════════════════
  const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';
  const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';
  // ══════════════════════════════════════════

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentViewer = null;
  let room = null;

  // ── AUTH STATE ──
  db.auth.onAuthStateChange(async (event, session) => {
    if (session) {
      const user = session.user;
      const savedName = localStorage.getItem('olyesti_name');

      if (!savedName) {
        // Show name prompt
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('name-screen').style.display = 'flex';
      } else {
        enterLounge(user, savedName);
      }
    }
  });

  // ── LOGIN ──
  async function loginWithEmail() {
    const email = document.getElementById('email-input').value.trim();
    if (!email) return;
    const { error } = await db.auth.signInWithOtp({ email });
    const msg = document.getElementById('login-msg');
    msg.textContent = error
      ? '⚠️ ' + error.message
      : '✉️ Check your email for your lounge link!';
  }

  // ── SAVE NAME ──
  async function saveName() {
    const name = document.getElementById('name-input').value.trim();
    if (!name) return;
    localStorage.setItem('olyesti_name', name);
    const { data: { session } } = await db.auth.getSession();
    if (session) enterLounge(session.user, name);
  }

  // ── ENTER LOUNGE ──
  function enterLounge(user, name) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('name-screen').style.display = 'none';
    document.getElementById('lounge').style.display = 'flex';

    currentViewer = {
      id: user.id,
      name: name,
      avatarUrl: `https://api.dicebear.com/7.x/thumbs/svg?seed=${user.id}`
    };

    setupPresence();
    setupChat();
  }

  // ── PRESENCE (audience seats) ──
  function setupPresence() {
    room = db.channel('lounge-presence', {
      config: { presence: { key: currentViewer.id } }
    });

    room.on('presence', { event: 'sync' }, () => {
      const state = room.presenceState();
      renderAudience(state);
    });

    room.subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        await room.track(currentViewer);
      }
    });
  }

  function renderAudience(state) {
    const row = document.getElementById('audience-row');
    row.innerHTML = '';
    let count = 0;

    Object.values(state).forEach(presences => {
      presences.forEach(viewer => {
        count++;
        if (count > 12) return; // max 12 visible seats
        const seat = document.createElement('div');
        seat.classList.add('seat');
        seat.innerHTML = `
          <img class="avatar" src="${viewer.avatarUrl}"
               alt="${viewer.name}" title="${viewer.name}"
               onerror="this.src='https://api.dicebear.com/7.x/thumbs/svg?seed=guest'" />
          <div class="chair"></div>
          <span class="viewer-label">${viewer.name}</span>
        `;
        row.appendChild(seat);
      });
    });

    const extra = Math.max(0, count - 12);
    if (extra > 0) {
      const more = document.createElement('div');
      more.classList.add('seat');
      more.innerHTML = `
        <div class="avatar" style="display:flex;align-items:center;justify-content:center;
             background:#1a1a1a;color:#c9a84c;font-size:11px;font-weight:bold;">
          +${extra}
        </div>
        <div class="chair"></div>
        <span class="viewer-label">more</span>
      `;
      row.appendChild(more);
    }

    document.getElementById('viewer-count').textContent =
      `${count} in the lounge`;
  }

  // ── CHAT ──
  function setupChat() {
    // Listen for new messages
    db.channel('lounge-chat')
      .on('broadcast', { event: 'message' }, ({ payload }) => {
        appendMessage(payload);
      })
      .subscribe();

    // Send on Enter key
    document.getElementById('chat-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text || !currentViewer) return;
    input.value = '';

    const msg = {
      id: Date.now(),
      name: currentViewer.name,
      avatarUrl: currentViewer.avatarUrl,
      text: text
    };

    // Broadcast to all viewers
    await db.channel('lounge-chat').send({
      type: 'broadcast',
      event: 'message',
      payload: msg
    });

    // Show locally immediately
    appendMessage(msg);
  }

  function appendMessage(msg) {
    const box = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.classList.add('chat-msg');
    div.innerHTML = `
      <img src="${msg.avatarUrl}"
           onerror="this.src='https://api.dicebear.com/7.x/thumbs/svg?seed=guest'"
           alt="${msg.name}" />
      <div class="chat-msg-body">
        <span class="chat-msg-name">${msg.name}</span>
        <span class="chat-msg-text">${escapeHtml(msg.text)}</span>
      </div>
    `;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;')
              .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
