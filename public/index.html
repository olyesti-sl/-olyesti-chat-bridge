<script>
const TINT_COLORS = [
  'transparent',
  'rgba(180,30,30,0.45)',
  'rgba(30,80,180,0.45)',
  'rgba(30,140,80,0.45)',
  'rgba(140,30,140,0.45)',
  'rgba(200,140,20,0.45)',
  'rgba(20,160,180,0.45)',
  'rgba(180,80,20,0.45)',
];
const TINT_LABELS = ['Original','Red','Blue','Green','Purple','Gold','Teal','Orange'];

let selGender = 'male';
let selTint = 0;

// Gender toggle
document.querySelectorAll('.gender-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selGender = btn.dataset.gender;
    updatePreview();
  };
});

// Tint picker
const tintPicker = document.getElementById('tintPicker');
TINT_COLORS.forEach((c, i) => {
  const s = document.createElement('div');
  s.className = 'swatch' + (i === 0 ? ' selected' : '');
  s.style.background = i === 0 ? 'linear-gradient(135deg,#333,#999)' : c.replace('0.45','1');
  s.title = TINT_LABELS[i];
  s.onclick = () => {
    tintPicker.querySelectorAll('.swatch').forEach(x => x.classList.remove('selected'));
    s.classList.add('selected');
    selTint = i;
    updatePreview();
  };
  tintPicker.appendChild(s);
});

function buildAvatarEl(gender, name, tintIndex) {
  const wrap = document.createElement('div');
  wrap.className = 'avatar';
  wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;width:80px;position:relative;';

  const img = document.createElement('img');
  img.src = gender === 'female' ? 'avatar-female.png' : 'avatar-male.png';
  img.style.cssText = 'width:80px;height:120px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.6));display:block;';
  img.alt = name || gender;

  const tint = TINT_COLORS[tintIndex !== undefined ? tintIndex : 0];
  const overlay = document.createElement('div');
  overlay.style.cssText = `position:absolute;top:0;left:0;right:0;bottom:0;background:${tint};mix-blend-mode:color;border-radius:4px;pointer-events:none;`;

  wrap.appendChild(img);
  wrap.appendChild(overlay);
  return wrap;
}

function hashName(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xfffff;
  return h;
}

function updatePreview() {
  const pw = document.getElementById('previewWrap');
  pw.innerHTML = '';
  pw.appendChild(buildAvatarEl(selGender, 'Preview', selTint));
}
updatePreview();

const nameInput = document.getElementById('nameInput');
const modal = document.getElementById('modal');
const stage = document.getElementById('stage');
const msgInput = document.getElementById('msgInput');
const myNameEl = document.getElementById('myName');

let identity = null;
const activeChars = {};

function getOrCreateChar(key, name, gender, tint) {
  if (activeChars[key]) return activeChars[key];
  const char = document.createElement('div');
  char.className = 'character';
  char.style.animationDelay = (Object.keys(activeChars).length * 0.4) + 's';

  const bubble = document.createElement('div');
  bubble.className = 'char-bubble';

  const avatar = buildAvatarEl(gender || 'male', name, tint || 0);

  const nameEl = document.createElement('div');
  nameEl.className = 'char-name';
  nameEl.textContent = name;

  const shadow = document.createElement('div');
  shadow.className = 'char-shadow';

  char.appendChild(bubble);
  char.appendChild(avatar);
  char.appendChild(nameEl);
  char.appendChild(shadow);
  stage.appendChild(char);

  activeChars[key] = { el: char, bubbleEl: bubble, timer: null };
  return activeChars[key];
}

function showMessage(key, name, text, gender, tint) {
  const ch = getOrCreateChar(key, name, gender, tint);
  ch.bubbleEl.textContent = text.slice(0, 120);
  ch.bubbleEl.classList.add('visible');
  if (ch.timer) clearTimeout(ch.timer);
  ch.timer = setTimeout(() => ch.bubbleEl.classList.remove('visible'), 7000);
}

function handleMessage(msg) {
  const slBubble = document.getElementById('bubble-sl');
  if (msg.source === 'secondlife') {
    showMessage('sl_' + msg.speaker, msg.speaker, msg.text, 'male', 0);
    slBubble.textContent = msg.speaker + ': ' + msg.text.slice(0, 80);
    slBubble.classList.add('visible');
    setTimeout(() => slBubble.classList.remove('visible'), 5000);
  } else {
    showMessage('web_' + msg.speaker, msg.speaker, msg.text, msg.gender, msg.tint);
  }
}

function loadIdentity() {
  const saved = localStorage.getItem('olyesti_identity');
  if (saved) {
    identity = JSON.parse(saved);
    applyIdentity();
    modal.style.display = 'none';
  }
}

function applyIdentity() {
  myNameEl.textContent = identity.name;
  getOrCreateChar('me', identity.name, identity.gender, identity.tint);
}

document.getElementById('saveBtn').onclick = () => {
  const name = nameInput.value.trim();
  if (!name) { nameInput.focus(); return; }
  identity = { name, gender: selGender, tint: selTint, guest: false };
  localStorage.setItem('olyesti_identity', JSON.stringify(identity));
  applyIdentity();
  modal.style.display = 'none';
};

document.getElementById('guestBtn').onclick = () => {
  const h = Math.floor(Math.random()*9000+1000);
  identity = { name: 'Guest' + h, gender: 'male', tint: 0, guest: true };
  applyIdentity();
  modal.style.display = 'none';
};

document.getElementById('changeId').onclick = () => {
  if (identity) {
    nameInput.value = identity.guest ? '' : identity.name;
    selGender = identity.gender || 'male';
    selTint = identity.tint || 0;
    document.querySelectorAll('.gender-btn').forEach(b => {
      b.classList.toggle('selected', b.dataset.gender === selGender);
    });
    tintPicker.querySelectorAll('.swatch').forEach((s, i) => {
      s.classList.toggle('selected', i === selTint);
    });
    updatePreview();
  }
  modal.style.display = 'flex';
};

const socket = io();
socket.on('history', msgs => msgs.slice(-5).forEach(m => handleMessage(m)));
socket.on('message', msg => handleMessage(msg));

function send() {
  const text = msgInput.value.trim();
  if (!text || !identity) return;
  socket.emit('web-message', { name: identity.name, text, gender: identity.gender, tint: identity.tint });
  msgInput.value = '';
}

document.getElementById('sendBtn').onclick = send;
msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

loadIdentity();
</script>
