<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Olyesti Cafe — Live Lounge</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Georgia', serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
      background: radial-gradient(ellipse at center, #1a1200 0%, #0a0a0a 70%);
    }
    #login-screen h1 { color: #c9a84c; font-size: 2rem; letter-spacing: 3px; text-transform: uppercase; }
    #login-screen p { color: #888; font-size: 0.85rem; letter-spacing: 1px; }

    .gold-btn {
      background: #c9a84c;
      color: #000;
      padding: 12px 32px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      letter-spacing: 1px;
      transition: background 0.2s;
    }
    .gold-btn:hover { background: #e0c060; }

    #login-msg { color: #c9a84c; font-size: 0.85rem; min-height: 20px; }

    #lounge {
      display: none;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #topbar {
      background: #111;
      border-bottom: 1px solid #2a2a2a;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #topbar .logo { color: #c9a84c; font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; }
    #topbar .viewer-count { color: #888; font-size: 0.8rem; }

    #main { display: flex; flex: 1; overflow: hidden; }

    #stage {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 12px;
      gap: 10px;
      overflow: hidden;
    }

    #tv-frame {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border: 2px solid #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }
    #tv-frame iframe { width: 100%; height: 100%; border: none; }

    #audience-section { flex-shrink: 0; }
    #audience-label { color: #555; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }

    #audience-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
      min-height: 90px;
    }

    .seat { display: flex; flex-direction: column; align-items: center; gap: 2px; }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #c9a84c;
      object-fit: cover;
      background: #222;
    }

    .chair {
      width: 52px;
      height: 14px;
      background: #5a3e2b;
      border-radius: 4px 4px 0 0;
      box-shadow: 0 4px 0 #3d2a1a;
    }

    .viewer-label {
      font-size: 9px;
      color: #c9a84c;
      text-align: center;
      max-width: 56px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      margin-top: 4px;
    }

    #chat-panel {
      width: 300px;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #1e1e1e;
      background: #0d0d0d;
      overflow: hidden;
    }

    #chat-header {
      padding: 10px 14px;
      border-bottom: 1px solid #1e1e1e;
      color: #c9a84c;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: #2a2a2a #0d0d0d;
    }
    #chat-messages::-webkit-scrollbar { width: 4px; }
    #chat-messages::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }

    .chat-msg { display: flex; gap: 8px; align-items: flex-start; }
    .chat-msg img { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #c9a84c; flex-shrink: 0; }
    .chat-msg-body { display: flex; flex-direction: column; gap: 2px; }
    .chat-msg-name { font-size: 0.7rem; color: #c9a84c; font-weight: bold; }
    .chat-msg-text { font-size: 0.85rem; color: #ddd; line-height: 1.4; word-break: break-word; }

    #chat-input-area {
      flex-shrink: 0;
      padding: 10px;
      border-top: 1px solid #1e1e1e;
      display: flex;
      gap: 8px;
      background: #0d0d0d;
    }

    #chat-input {
      flex: 1;
      padding: 9px 12px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      resize: none;
      font-family: inherit;
    }
    #chat-input:focus { border-color: #c9a84c; }

    #send-btn {
      background: #c9a84c;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 1rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    #send-btn:hover { background: #e0c060; }
  </style>
</head>
