<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Olyesti Live Chat</title>
<script src="/socket.io/socket.io.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #050508;
  color: #e8e8e8;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

/* ── MAIN SCENE (full screen) ── */
#scene {
  position: fixed;
  inset: 0;
  cursor: crosshair;
  z-index: 1;
}
#bg {
  position: absolute; inset: 0;
  background: url('lounge.jpg') center center / cover no-repeat;
  filter: brightness(0.75);
}
#bg::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 30%, rgba(0,0,0,0.55) 100%);
}
#stage { position: absolute; inset: 0; z-index: 10; }

/* ── FLOATING CHAT PANEL ── */
#chatPanel {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 300px;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 0;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.7);
  border: 1px solid rgba(255,200,80,0.15);
}
#chatToggleBar {
  background: rgba(10,7,3,0.97);
  border-bottom: 1px solid rgba(255,200,80,0.1);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
}
#chatToggleBar span { font-size: 0.72rem; color: #7a6a4a; letter-spacing: 0.05em; }
#chatToggleBar .toggle-icon { font-size: 0.8rem; color: #5a4a2a; transition: transform 0.2s; }
#chatPanel.collapsed #chatToggleBar .toggle-icon { transform: rotate(180deg); }

#msgLog {
  background: rgba(6,4,2,0.94);
  height: 200px;
  overflow-y: auto;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  scroll-behavior: smooth;
}
#chatPanel.collapsed #msgLog { display: none; }
#chatPanel.collapsed #composeBar { display: none; }

.msg-entry {
  font-size: 0.78rem;
  line-height: 1.4;
  color: #c8b890;
  word-break: break-word;
}
.msg-entry .msg-name {
  color: #e8c870;
  font-weight: 600;
  margin-right: 5px;
}
.msg-entry.sl .msg-name { color: #80c8ff; }
.msg-entry.system { color: #5a4a2a; font-style: italic; }

#composeBar {
  background: rgba(8,5,2,0.97);
  border-top: 1px solid rgba(255,200,80,0.08);
  padding: 8px 10px;
  display: flex;
  gap: 6px;
  align-items: center;
}
#msgInput {
  flex: 1;
  background: #100e08;
  color: #e8d8b0;
  border: 1px solid rgba(255,200,80,0.15);
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 0.82rem;
  font-family: inherit;
  outline: none;
}
#msgInput:focus {
  border-color: rgba(255,200,80,0.4);
}
#sendBtn {
  background: rgba(180,120,20,0.25);
  color: #d4a840;
  border: 1px solid rgba(255,200,80,0.2);
  border-radius: 8px;
  padding: 7px 12px;
  cursor: pointer;
  font-size: 0.8rem;
  font-family: inherit;
  transition: background 0.2s;
  white-space: nowrap;
}
#sendBtn:hover { background: rgba(180,120,20,0.45); color: #ffcc60; }

/* ── MOVEMENT MODE INDICATOR ── */
#moveMode {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  background: rgba(10,8,20,0.85);
  border: 1px solid rgba(100,200,255,0.3);
  border-radius: 20px;
  padding: 5px 16px;
  font-size: 0.68rem;
  color: rgba(100,200,255,0.8);
  letter-spacing: 0.08em;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}
#moveMode.active { opacity: 1; }

/* ── FURNITURE HOTSPOTS ── */
.furniture-spot {
  position: absolute;
  transform: translate(-50%, -50%);
  z-index: 5;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.furniture-ring {
  border-radius: 50%;
  border: 2px solid rgba(100,200,255,0.5);
  background: rgba(100,200,255,0.08);
  transition: all 0.2s;
  animation: ring-pulse 2s ease-in-out infinite;
}
.furniture-spot:hover .furniture-ring {
  border-color: rgba(100,200,255,0.9);
  background: rgba(100,200,255,0.2);
}
.furniture-spot.occupied .furniture-ring {
  border-color: rgba(255,100,100,0.5);
  background: rgba(255,100,100,0.08);
  animation: none;
}
.furniture-label {
  font-size: 0.5rem;
  color: rgba(100,200,255,0.7);
  letter-spacing: 0.05em;
  white-space: nowrap;
  text-shadow: 0 1px 4px rgba(0,0,0,1);
}
.furniture-spot.occupied .furniture-label { color: rgba(255,100,100,0.6); }
@keyframes ring-pulse {
  0%,100% { opacity:0.6; transform:scaleX(1); }
  50%      { opacity:1;   transform:scaleX(1.08); }
}

/* ── CHARACTER ── */
.character {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform-origin: bottom center;
  pointer-events: none;
}
.character.seated { pointer-events: all; cursor: pointer; }
.char-bubble {
  background: rgba(10,8,20,0.92);
  border: 1px solid rgba(255,220,100,0.3);
  border-radius: 12px;
  padding: 6px 11px;
  font-size: 0.8rem;
  color: #e8d
