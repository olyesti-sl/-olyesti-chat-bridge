<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Olyesti Live Chat</title>
<script src="/socket.io/socket.io.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #050508;
  color: #e8e8e8;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#scene {
  flex: 1;
  position: relative;
  overflow: hidden;
}

#bg {
  position: absolute;
  inset: 0;
  background: url('lounge.jpg') center center / cover no-repeat;
  filter: brightness(0.75);
}

#bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.65) 100%);
}

#stage {
  position: absolute;
  bottom: 10%;
  left: 0; right: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 20px;
  z-index: 10;
  overflow-x: auto;
  padding: 0 16px;
  flex-wrap: nowrap;
  scrollbar-width: none;
}
#stage::-webkit-scrollbar { display: none; }


.character {
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: float 3s ease-in-out infinite;
}
.character:nth-child(2) { animation-delay: 0.5s; }
.character:nth-child(3) { animation-delay: 1s; }
.character:nth-child(4) { animation-delay: 1.5s; }
.character:nth-child(5) { animation-delay: 2s; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

.char-bubble {
  background: rgba(10,8,20,0.88);
  border: 1px solid rgba(255,220,100,0.2);
  border-radius: 12px;
  padding: 6px 11px;
  font-size: 0.72rem;
  color: #e8d8b0;
  max-width: 260px;
  text-align: center;
  margin-bottom: 8px;
  opacity: 0;
  transition: opacity 0.3s;
  line-height: 1.35;
  word-break: break-word;
  position: relative;
}
.char-bubble.visible { opacity: 1; }
.char-bubble::after {
  content: '';
  position: absolute;
  bottom: -6px; left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: rgba(255,220,100,0.2);
  border-bottom: none;
}

.char-body {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.char-head {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  border: 2px solid rgba(255,200,80,0.3);
  box-shadow: 0 0 18px rgba(200,140,40,0.3), 0 4px 12px rgba(0,0,0,0.5);
  background: rgba(20,14,8,0.85);
}

.char-torso {
  width: 34px;
  height: 38px;
  border-radius: 8px 8px 4px 4px;
  margin-top: -4px;
}

.char-name {
  font-size: 0.65rem;
  color: rgba(255,220,140,0.7);
  margin-top: 5px;
  letter-spacing: 0.06em;
  white-space: nowrap;
  text-shadow: 0 1px 6px rgba(0,0,0,1);
}

.char-shadow {
  width: 38px; height: 8px;
  background: rgba(0,0,0,0.5);
  border-radius: 50%;
  filter: blur(4px);
  margin-top: 3px;
}

.color-0 { background: linear-gradient(180deg,#3d2a0a,#1e1205); }
.color-1 { background: linear-gradient(180deg,#1a2a3d,#0a1220); }
.color-2 { background: linear-gradient(180deg,#2d1a0a,#180d05); }
.color-3 { background: linear-gradient(180deg,#1a3d2a,#0a2015); }
.color-4 { background: linear-gradient(180deg,#3d1a2a,#200a15); }
.color-5 { background: linear-gradient(180deg,#2a2a1a,#151508); }

footer {
  background: rgba(6,4,2,0.96);
  border-top: 1px solid rgba(255,200,80,0.12);
  padding: 10px 16px 14px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
#identityBar {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.75rem;
  color: #555;
}
#identityBar #myAvatar { font-size: 1rem; }
#identityBar #myName { color: #7a6a4a; }
#changeId { cursor: pointer; color: #3a3020; text-decoration: underline; font-size: 0.7rem; }
#changeId:hover { color: #aa9060; }
#compose { display: flex; gap: 8px; }
input, button { font-family: inherit; font-size: 0.9rem; border: none; outline: none; }
#msgInput {
  flex: 1;
  background: #100e08;
  color: #e8d8b0;
  border: 1px solid rgba(255,200,80,0.15);
  border-radius: 10px;
  padding: 10px 14px;
}
#msgInput:focus { border-color: rgba(255,200,80,0.35); }
#sendBtn {
  background: rgba(180,120,20,0.25);
  color: #d4a840;
  border: 1px solid rgba(255,200,80,0.2);
  border-radius: 10px;
  padding: 10px 18px;
  cursor: pointer;
  transition: background 0.2s;
}
#sendBtn:hover { background: rgba(180,120,20,0.4); color: #ffcc60; }

#modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.92);
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
}
#modalBox {
  background: #0d0a06;
  border: 1px solid rgba(255,200,80,0.15);
  border-radius: 16px;
  padding: 28px 24px;
  width: 320px;
  display: flex; flex-direction: column; gap: 16px;
}
#modalBox h2 { font-size: 1.1rem; color: #e8c870; }
#modalBox p { font-size: 0.78rem; color: #5a4a2a; }
#nameInput {
  background: #100e08;
  color: #e8d8b0;
  border: 1px solid rgba(255,200,80,0.2);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 0.9rem;
  font-family: inherit;
  width: 100%;
}
.icon-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 8px; }
.icon-opt {
  font-size: 1.4rem; text-align: center; cursor: pointer;
  padding: 6px; border-radius: 8px;
  border: 2px solid transparent; transition: border-color 0.15s;
}
.icon-opt.selected { border-color: rgba(255,200,80,0.4); background: #1a1408; }
.modal-btns { display: flex; gap: 8px; }
.modal-btns button {
  flex: 1; padding: 10px; border-radius: 8px;
  cursor: pointer; font-family: inherit; font-size: 0.85rem;
}
#guestBtn { background: #100e08; color: #7a6a4a; border: 1px solid rgba(255,200,80,0.1); }
#saveBtn { background: rgba(180,120,20,0.3); color: #e8c870; border: 1px solid rgba(255,200,80,0.25); }
#guestBtn:hover { background: #181408; }
#saveBtn:hover { background: rgba(180,120,20,0.5); }
</style>
</head>
<body>

<div id="modal">
  <div id="modalBox">
    <h2>Welcome to Olyesti</h2>
    <p>Choose your avatar name and icon — saved for future visits.</p>
    <input id="nameInput" type="text" placeholder="Your display name" maxlength="32" />
    <div class="icon-grid" id="iconGrid"></div>
    <div class="modal-btns">
      <button id="guestBtn">Join as Guest</button>
      <button id="saveBtn">Save & Enter</button>
    </div>
  </div>
</div>

<div id="scene">
  <div id="bg"></div>
  <div id="stage">
    <div class="character" id="char-sl">
      <div class="char-bubble visible" id="bubble-sl">Connected to Second Life</div>
      <div class="char-body">
        <div class="char-head">🌐</div>
        <div class="char-torso color-1"></div>
      </div>
      <div class="char-name">SL Relay</div>
      <div class="char-shadow"></div>
    </div>
  </div>
</div>

<footer>
  <div id="identityBar">
    <span id="myAvatar"></span>
    <span id="myName"></span>
    <span id="changeId">change</span>
  </div>
  <div id="compose">
    <input id="msgInput" type="text" placeholder="Message…" maxlength="300" />
    <button id="sendBtn">Send</button>
  </div>
</footer>

<script>
const ICONS = ['☕','🌿','🦋','🌙','⭐','🔥','🌸','🍵','🦊','🐺','🌊','💎','🎭','🪐','🌺','🦁','🐉','✨','🍂','🌴'];
const COLORS = ['color-0','color-1','color-2','color-3','color-4','color-5'];

const iconGrid = document.getElementById('iconGrid');
const nameInput = document.getElementById('nameInput');
const modal = document.getElementById('modal');
const stage = document.getElementById('stage');
const msgInput = document.getElementById('msgInput');
const myNameEl = document.getElementById('myName');
const myAvatarEl = document.getElementById('myAvatar');

let selectedIcon = ICONS[0];
let identity = null;
const activeChars = {};

ICONS.forEach((ic, i) => {
  const d = document.createElement('div');
  d.className = 'icon-opt' + (i === 0 ? ' selected' : '');
  d.textContent = ic;
  d.onclick = () => {
    document.querySelectorAll('.icon-opt').forEach(x => x.classList.remove('selected'));
    d.classList.add('selected');
    selectedIcon = ic;
  };
  iconGrid.appendChild(d);
});

function colorForName(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffff;
  return COLORS[h % COLORS.length];
}

function iconForName(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 17 + name.charCodeAt(i)) & 0xffff;
  return ICONS[h % ICONS.length];
}

function getOrCreateChar(key, icon, name, colorClass) {
  if (activeChars[key]) return activeChars[key];
  const char = document.createElement('div');
  char.className = 'character';
  char.style.animationDelay = (Object.keys(activeChars).length * 0.4) + 's';
  const bubble = document.createElement('div');
  bubble.className = 'char-bubble';
  const body = document.createElement('div');
  body.className = 'char-body';
  const head = document.createElement('div');
  head.className = 'char-head';
  head.textContent = icon;
  const torso = document.createElement('div');
  torso.className = 'char-torso ' + colorClass;
  const nameEl = document.createElement('div');
  nameEl.className = 'char-name';
  nameEl.textContent = name;
  const shadow = document.createElement('div');
  shadow.className = 'char-shadow';
  body.appendChild(head);
  body.appendChild(torso);
  char.appendChild(bubble);
  char.appendChild(body);
  char.appendChild(nameEl);
  char.appendChild(shadow);
  stage.appendChild(char);
  activeChars[key] = { el: char, bubbleEl: bubble, timer: null };
  return activeChars[key];
}

function showMessage(key, icon, name, colorClass, text) {
  const ch = getOrCreateChar(key, icon, name, colorClass);
  ch.bubbleEl.textContent = text.slice(0, 80);
  ch.bubbleEl.classList.add('visible');
  if (ch.timer) clearTimeout(ch.timer);
  ch.timer = setTimeout(() => ch.bubbleEl.classList.remove('visible'), 6000);
}

function handleMessage(msg) {
  const slBubble = document.getElementById('bubble-sl');
  if (msg.source === 'secondlife') {
    const key = 'sl_' + msg.speaker;
    showMessage(key, iconForName(msg.speaker), msg.speaker, colorForName(msg.speaker), msg.text);
    slBubble.textContent = msg.speaker + ': ' + msg.text.slice(0, 60);
    slBubble.classList.add('visible');
    setTimeout(() => slBubble.classList.remove('visible'), 5000);
  } else {
    const key = 'web_' + msg.speaker;
    showMessage(key, iconForName(msg.speaker), msg.speaker, colorForName(msg.speaker), msg.text);
  }
}

function loadIdentity() {
  const saved = localStorage.getItem('olyesti_identity');
  if (saved) {
    identity = JSON.parse(saved);
    applyIdentity();
    modal.style.display = 'none';
  }
}

function applyIdentity() {
  myAvatarEl.textContent = identity.icon;
  myNameEl.textContent = identity.name;
  getOrCreateChar('me', identity.icon, identity.name, colorForName(identity.name));
}

document.getElementById('saveBtn').onclick = () => {
  const name = nameInput.value.trim();
  if (!name) { nameInput.focus(); return; }
  identity = { name, icon: selectedIcon, guest: false };
  localStorage.setItem('olyesti_identity', JSON.stringify(identity));
  applyIdentity();
  modal.style.display = 'none';
};

document.getElementById('guestBtn').onclick = () => {
  identity = { name: 'Guest' + Math.floor(Math.random()*9000+1000), icon: '👤', guest: true };
  applyIdentity();
  modal.style.display = 'none';
};

document.getElementById('changeId').onclick = () => {
  nameInput.value = identity.guest ? '' : identity.name;
  modal.style.display = 'flex';
};

const socket = io();
socket.on('history', msgs => msgs.slice(-5).forEach(m => handleMessage(m)));
socket.on('message', msg => handleMessage(msg));

function send() {
  const text = msgInput.value.trim();
  if (!text || !identity) return;
  socket.emit('web-message', { name: identity.name, text });
  msgInput.value = '';
}

document.getElementById('sendBtn').onclick = send;
msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

loadIdentity();
</script>
</body>
</html>
