<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Olyesti Live Chat</title>
<script src="/socket.io/socket.io.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #050508;
  color: #e8e8e8;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#scene { flex: 1; position: relative; overflow: hidden; }

#bg {
  position: absolute; inset: 0;
  background: url('lounge.jpg') center center / cover no-repeat;
  filter: brightness(0.75);
}
#bg::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.65) 100%);
}

#stage {
  position: absolute;
  bottom: 10%; left: 0; right: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 20px;
  z-index: 10;
  overflow-x: auto;
  padding: 0 16px;
  flex-wrap: nowrap;
  scrollbar-width: none;
}
#stage::-webkit-scrollbar { display: none; }

.character {
  display: flex; flex-direction: column; align-items: center;
  animation: float 3s ease-in-out infinite;
  flex-shrink: 0;
}
.character:nth-child(2) { animation-delay: 0.5s; }
.character:nth-child(3) { animation-delay: 1s; }
.character:nth-child(4) { animation-delay: 1.5s; }
.character:nth-child(5) { animation-delay: 2s; }
.character:nth-child(6) { animation-delay: 2.5s; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

.char-bubble {
  background: rgba(10,8,20,0.9);
  border: 1px solid rgba(255,220,100,0.25);
  border-radius: 12px;
  padding: 7px 12px;
  font-size: 0.82rem;
  color: #e8d8b0;
  max-width: 260px;
  text-align: center;
  margin-bottom: 10px;
  opacity: 0;
  transition: opacity 0.3s;
  line-height: 1.4;
  word-break: break-word;
  position: relative;
  pointer-events: none;
}
.char-bubble.visible { opacity: 1; }
.char-bubble::after {
  content: ''; position: absolute;
  bottom: -7px; left: 50%; transform: translateX(-50%);
  border: 7px solid transparent;
  border-top-color: rgba(255,220,100,0.25);
  border-bottom: none;
}

.char-name {
  font-size: 0.65rem;
  color: rgba(255,220,140,0.7);
  margin-top: 6px;
  letter-spacing: 0.06em;
  white-space: nowrap;
  text-shadow: 0 1px 6px rgba(0,0,0,1);
}

.char-shadow {
  width: 60px; height: 8px;
  background: rgba(0,0,0,0.45);
  border-radius: 50%;
  filter: blur(5px);
  margin-top: 3px;
}

footer {
  background: rgba(6,4,2,0.96);
  border-top: 1px solid rgba(255,200,80,0.12);
  padding: 10px 16px 14px;
  z-index: 20;
  display: flex; flex-direction: column; gap: 8px;
}
