<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Olyesti Cafe — Live Lounge</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Georgia', serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
      background: radial-gradient(ellipse at center, #2a1f00 0%, #0a0a0a 70%);
      padding: 24px;
      overflow-y: auto;
    }
    .screen.active { display: flex; }
    .screen h1 { color: #c9a84c; font-size: 2rem; letter-spacing: 3px; text-transform: uppercase; }
    .screen h2 { color: #c9a84c; font-size: 1.4rem; letter-spacing: 2px; }
    .screen p  { color: #aaa; font-size: 0.9rem; text-align: center; }
    .text-input {
      padding: 12px 16px;
      border-radius: 6px;
      border: 1px solid #c9a84c;
      background: #1a1a1a;
      color: #fff;
      width: 280px;
      font-size: 1rem;
      outline: none;
    }
    .text-input:focus { border-color: #e0c060; }
    .gold-btn {
      background: #c9a84c;
      color: #000;
      padding: 12px 32px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      letter-spacing: 1px;
      transition: background 0.2s;
    }
    .gold-btn:hover { background: #e0c060; }
    .ghost-btn {
      background: transparent;
      color: #c9a84c;
      padding: 10px 24px;
      border: 1px solid #c9a84c;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .ghost-btn:hover { background: #c9a84c22; }
    .error-msg { color: #e07070; font-size: 0.85rem; min-height: 20px; }
    #character-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      max-width: 680px;
      width: 100%;
      max-height: 55vh;
      overflow-y: auto;
      padding: 4px;
      scrollbar-width: thin;
      scrollbar-color: #c9a84c #1a1a1a;
    }
    .char-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 8px;
      border-radius: 10px;
      border: 2px solid #2a2a2a;
      transition: border-color 0.2s, background 0.2s;
      background: #1a1500;
    }
    .char-card:hover { border-color: #c9a84c; background: #241e00; }
    .char-card.selected { border-color: #c9a84c; background: #241e00; box-shadow: 0 0 12px #c9a84c44; }
    .char-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      object-position: center top;
      border-radius: 8px;
      background: transparent;
      color: transparent;
    }
