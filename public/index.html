<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Olyesti Cafe — Live Lounge</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Georgia', serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
      background: radial-gradient(ellipse at center, #2a1f00 0%, #0a0a0a 70%);
    }
    #login-screen h1 {
      color: #c9a84c;
      font-size: 2rem;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    #login-screen p {
      color: #aaa;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    #name-input-login {
      padding: 12px 16px;
      border-radius: 6px;
      border: 1px solid #c9a84c;
      background: #1a1a1a;
      color: #fff;
      width: 280px;
      font-size: 1rem;
      outline: none;
    }
    #name-input-login:focus { border-color: #e0c060; }

    .gold-btn {
      background: #c9a84c;
      color: #000;
      padding: 12px 32px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      letter-spacing: 1px;
      transition: background 0.2s;
    }
    .gold-btn:hover { background: #e0c060; }

    #login-msg {
      color: #e07070;
      font-size: 0.85rem;
      min-height: 20px;
    }

    #lounge {
      display: none;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: #0a0a0a;
    }

    #topbar {
      background: #111;
      border-bottom: 1px solid #2a2a2a;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .logo { color: #c9a84c; font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; }
    .viewer-count { color: #888; font-size: 0.8rem; }

    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #stage {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 12px;
      gap: 10px;
      overflow: hidden;
    }

    /* TV fixed at 55% height so chairs always show */
    #tv-frame {
      width: 100%;
      height: 55vh;
      background: #000;
      border: 2px solid #333;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }
    #tv-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Audience section */
    #audience-section {
      flex-shrink: 0;
      padding-bottom: 8px;
    }
    #audience-label {
      color: #555;
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    #audience-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
      min-height: 100px;
      padding-bottom: 8px;
    }

    .seat { display: flex; flex-direction: column; align-items: center; gap: 2px; }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #c9a84c;
      object-fit: cover;
      background: #222;
    }

    .chair {
      width: 52px;
      height: 14px;
      background: #5a3e2b;
      border-radius: 4px 4px 0 0;
      box-shadow: 0 4px 0 #3d2a1a;
    }

    .viewer-label {
      font-size: 9px;
      color: #c9a84c;
      text-align: center;
      max-width: 56px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      margin-top: 4px;
    }

    /* Chat panel */
    #chat-panel {
      width: 300px;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #1e1e1e;
      background: #0d0d0d;
      overflow: hidden;
    }

    #chat-header {
      padding: 10px 14px;
      border-bottom: 1px solid #1e1e1e;
      color: #c9a84c;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: #2a2a2a #0d0d0d;
    }
    #chat-messages::-webkit-scrollbar { width: 4px; }
    #chat-messages::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }

    .chat-msg { display: flex; gap: 8px; align-items: flex-start; }
    .chat-msg img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid #c9a84c;
      flex-shrink: 0;
    }
    .chat-msg-body { display: flex; flex-direction: column; gap: 2px; }
    .chat-msg-name { font-size: 0.7rem; color: #c9a84c; font-weight: bold; }
    .chat-msg-text { font-size: 0.85rem; color: #ddd; line-height: 1.4; word-break: break-word; }

    #chat-input-area {
      flex-shrink: 0;
      padding: 10px;
      border-top: 1px solid #1e1e1e;
      display: flex;
      gap: 8px;
      background: #0d0d0d;
    }

    #chat-input {
      flex: 1;
      padding: 9px 12px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      resize: none;
      font-family: inherit;
    }
    #chat-input:focus { border-color: #c9a84c; }

    #send-btn {
      background: #c9a84c;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 1rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    #send-btn:hover { background: #e0c060; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <h1>☕ Olyesti Cafe</h1>
  <p>Enter your name to join the lounge</p>
  <input id="name-input-login" type="text" placeholder="Your name..." maxlength="24" />
  <button class="gold-btn" onclick="quickJoin()">Enter the Lounge</button>
  <span id="login-msg"></span>
</div>

<!-- LOUNGE -->
<div id="lounge">
  <div id="topbar">
    <span class="logo">☕ Olyesti Cafe</span>
    <span class="viewer-count" id="viewer-count">0 in the lounge</span>
  </div>

  <div id="main">

    <div id="stage">

      <!-- TV -->
      <div id="tv-frame">
        <iframe
          src="https://player.twitch.tv/?channel=olyesti&parent=chat.olyesti.com"
          allowfullscreen>
        </iframe>
      </div>

      <!-- Audience chairs -->
      <div id="audience-section">
        <div id="audience-label">Now Watching</div>
        <div id="audience-row"></div>
      </div>

    </div>

    <!-- Chat -->
    <div id="chat-panel">
      <div id="chat-header">💬 Lounge Chat</div>
      <div id="chat-messages"></div>
      <div id="chat-input-area">
        <textarea id="chat-input" rows="1" placeholder="Say something..."></textarea>
        <button id="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>

  </div>
</div>

<script>
  const SUPABASE_URL = 'https://esaeyeqjbktkcdrydgmy.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzYWV5ZXFqYmt0a2NkcnlkZ215Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNzIwMDgsImV4cCI6MjEwNDc0ODAwOH0.jq909W6aOx7lIO6m_4wxwUv3vJ2xxowLbay2SJ7O1_8';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentViewer = null;
  let presenceRoom = null;
  let chatRoom = null;

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('name-input-login').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') quickJoin();
    });
  });

  function quickJoin() {
    const name = document.getElementById('name-input-login').value.trim();
    if (!name) {
      document.getElementById('login-msg').textContent = '⚠️ Please enter a name';
      return;
    }
    const id = 'guest_' + Math.random().toString(36).substr(2, 9);
    currentViewer = { id, name, avatarUrl: `https://api.dicebear.com/7.x/thumbs/svg?seed=${id}` };
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('lounge').style.display = 'flex';
    setupPresence();
    setupChat();
  }

  function setupPresence() {
    presenceRoom = db.channel('lounge-presence', {
      config: { presence: { key: currentViewer.id } }
    });
    presenceRoom.on('presence', { event: 'sync' }, () => {
      renderAudience(presenceRoom.presenceState());
    });
    presenceRoom.subscribe(async (status) => {
      if (status === 'SUBSCRIBED') await presenceRoom.track(currentViewer);
    });
  }

  function renderAudience(state) {
    const row = document.getElementById('audience-row');
    row.innerHTML = '';
    let count = 0;
    Object.values(state).forEach(presences => {
      presences.forEach(viewer => {
        count++;
        if (count > 12) return;
        const seat = document.createElement('div');
        seat.classList.add('seat');
        seat.innerHTML = `
          <img class="avatar" src="${viewer.avatarUrl}" alt="${viewer.name}" title="${viewer.name}"
               onerror="this.src='https://api.dicebear.com/7.x/thumbs/svg?seed=guest'" />
          <div class="chair"></div>
          <span class="viewer-label">${viewer.name}</span>
        `;
        row.appendChild(seat);
      });
    });
    if (count > 12) {
      const more = document.createElement('div');
      more.classList.add('seat');
      more.innerHTML = `
        <div class="avatar" style="display:flex;align-items:center;justify-content:center;
             background:#1a1a1a;color:#c9a84c;font-size:11px;font-weight:bold;">+${count - 12}</div>
        <div class="chair"></div>
        <span class="viewer-label">more</span>
      `;
      row.appendChild(more);
    }
    document.getElementById('viewer-count').textContent = `${count} in the lounge`;
  }

  function setupChat() {
    chatRoom = db.channel('lounge-chat');
    chatRoom.on('broadcast', { event: 'message' }, ({ payload }) => {
      appendMessage(payload);
    }).subscribe();
    document.getElementById('chat-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text || !currentViewer) return;
    input.value = '';
    const msg = { id: Date.now(), name: currentViewer.name, avatarUrl: currentViewer.avatarUrl, text };
    appendMessage(msg);
    await chatRoom.send({ type: 'broadcast', event: 'message', payload: msg });
  }

  function appendMessage(msg) {
    const box = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.classList.add('chat-msg');
    div.innerHTML = `
      <img src="${msg.avatarUrl}" alt="${msg.name}"
           onerror="this.src='https://api.dicebear.com/7.x/thumbs/svg?seed=guest'" />
      <div class="chat-msg-body">
        <span class="chat-msg-name">${msg.name}</span>
        <span class="chat-msg-text">${escapeHtml(msg.text)}</span>
      </div>
    `;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
