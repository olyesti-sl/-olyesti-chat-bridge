<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Olyesti Live Chat</title>
<script src="/socket.io/socket.io.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #050508;
  color: #e8e8e8;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#scene {
  flex: 1;
  position: relative;
  overflow: hidden;
}

#bg {
  position: absolute;
  inset: 0;
  background: url('lounge.jpg') center center / cover no-repeat;
  filter: brightness(0.75);
}
#bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.65) 100%);
}

#stage {
  position: absolute;
  bottom: 10%;
  left: 0; right: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 20px;
  z-index: 10;
  overflow-x: auto;
  padding: 0 16px;
  flex-wrap: nowrap;
  scrollbar-width: none;
}
#stage::-webkit-scrollbar { display: none; }

.character {
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: float 3s ease-in-out infinite;
  flex-shrink: 0;
}
.character:nth-child(2) { animation-delay: 0.5s; }
.character:nth-child(3) { animation-delay: 1s; }
.character:nth-child(4) { animation-delay: 1.5s; }
.character:nth-child(5) { animation-delay: 2s; }
.character:nth-child(6) { animation-delay: 2.5s; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

/* Speech bubble */
.char-bubble {
  background: rgba(10,8,20,0.9);
  border: 1px solid rgba(255,220,100,0.25);
  border-radius: 12px;
  padding: 7px 12px;
  font-size: 0.82rem;
  color: #e8d8b0;
  max-width: 260px;
  text-align: center;
  margin-bottom: 10px;
  opacity: 0;
  transition: opacity 0.3s;
  line-height: 1.4;
  word-break: break-word;
  position: relative;
  pointer-events: none;
}
.char-bubble.visible { opacity: 1; }
.char-bubble::after {
  content: '';
  position: absolute;
  bottom: -7px; left: 50%;
  transform: translateX(-50%);
  border: 7px solid transparent;
  border-top-color: rgba(255,220,100,0.25);
  border-bottom: none;
}

/* 3D Avatar */
.avatar {
  position: relative;
  width: 60px;
  height: 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Hair */
.av-hair {
  position: absolute;
  top: -6px;
  width: 46px;
  height: 28px;
  border-radius: 50% 50% 0 0;
  z-index: 3;
}

/* Head */
.av-head {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  position: relative;
  z-index: 2;
  margin-top: 4px;
  box-shadow: inset -6px -4px 0 rgba(0,0,0,0.2), inset 4px 4px 0 rgba(255,255,255,0.08);
}

/* Eyes */
.av-eyes {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 4;
}
.av-eye {
  width: 6px;
  height: 7px;
  background: #1a1010;
  border-radius: 50%;
  position: relative;
}
.av-eye::after {
  content: '';
  position: absolute;
  top: 1px; left: 1px;
  width: 2px; height: 2px;
  background: rgba(255,255,255,0.7);
  border-radius: 50%;
}

/* Mouth */
.av-mouth {
  position: absolute;
  top: 28px;
  left: 50%;
  transform: translateX(-50%);
  width: 10px;
  height: 5px;
  border-bottom: 2px solid rgba(0,0,0,0.3);
  border-radius: 0 0 6px 6px;
  z-index: 4;
}

/* Neck */
.av-neck {
  width: 14px;
  height: 8px;
  margin-top: -2px;
  z-index: 1;
}

/* Body/torso */
.av-body {
  width: 44px;
  height: 44px;
  border-radius: 10px 10px 6px 6px;
  margin-top: -2px;
  position: relative;
  box-shadow: inset -5px -4px 0 rgba(0,0,0,0.2), inset 3px 3px 0 rgba(255,255,255,0.07);
  z-index: 1;
}

/* Legs */
.av-legs {
  display: flex;
  gap: 6px;
  margin-top: 2px;
}
.av-leg {
  width: 14px;
  height: 20px;
  border-radius: 4px 4px 6px 6px;
  box-shadow: inset -3px -2px 0 rgba(0,0,0,0.2);
}

.char-name {
  font-size: 0.65rem;
  color: rgba(255,220,140,0.7);
  margin-top: 6px;
  letter-spacing: 0.06em;
  white-space: nowrap;
  text-shadow: 0 1px 6px rgba(0,0,0,1);
}

.char-shadow {
  width: 44px; height: 8px;
  background: rgba(0,0,0,0.45);
  border-radius: 50%;
  filter: blur(5px);
  margin-top: 3px;
}

/* Skin tones */
.skin-0 { background: #f5c9a0; }
.skin-1 { background: #e8a87c; }
.skin-2 { background: #c68642; }
.skin-3 { background: #8d5524; }
.skin-4 { background: #fde0c8; }
.skin-5 { background: #d4956a; }

/* Hair colors */
.hair-0 { background: #2c1810; }
.hair-1 { background: #8b4513; }
.hair-2 { background: #f4d03f; }
.hair-3 { background: #1a1a2e; }
.hair-4 { background: #c0392b; }
.hair-5 { background: #7f8c8d; }

/* Outfit colors */
.outfit-0 { background: linear-gradient(180deg,#2c3e50,#1a252f); }
.outfit-1 { background: linear-gradient(180deg,#6b2d0e,#3d1a08); }
.outfit-2 { background: linear-gradient(180deg,#1a3a2a,#0d1f15); }
.outfit-3 { background: linear-gradient(180deg,#2d1a4e,#180d2a); }
.outfit-4 { background: linear-gradient(180deg,#3a2a0a,#1e1505); }
.outfit-5 { background: linear-gradient(180deg,#1a2a4e,#0d1528); }

/* Pants */
.pants-0 { background: #1a1a2e; }
.pants-1 { background: #2c1810; }
.pants-2 { background: #0d2a1a; }
.pants-3 { background: #2a1a0d; }
.pants-4 { background: #1a0d2a; }
.pants-5 { background: #0d1a2a; }

/* Neck skin match */
.neck-0 { background: #f5c9a0; }
.neck-1 { background: #e8a87c; }
.neck-2 { background: #c68642; }
.neck-3 { background: #8d5524; }
.neck-4 { background: #fde0c8; }
.neck-5 { background: #d4956a; }

/* Footer */
footer {
  background: rgba(6,4,2,0.96);
  border-top: 1px solid rgba(255,200,80,0.12);
  padding: 10px 16px 14px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
#identityBar {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.75rem;
  color: #555;
}
#identityBar #myAvatar { font-size: 1rem; }
#identityBar #myName { color: #7a6a4a; }
#changeId { cursor: pointer; color: #3a3020; text-decoration: underline; font-size: 0.7rem; }
#changeId:hover { color: #aa9060; }
#compose { display: flex; gap: 8px; }
input, button { font-family: inherit; font-size: 0.9rem; border: none; outline: none; }
#msgInput {
  flex: 1;
  background: #100e08;
  color: #e8d8b0;
  border: 1px solid rgba(255,200,80,0.15);
  border-radius: 10px;
  padding: 10px 14px;
}
#msgInput:focus { border-color: rgba(255,200,80,0.35); }
#sendBtn {
  background: rgba(180,120,20,0.25);
  color: #d4a840;
  border: 1px solid rgba(255,200,80,0.2);
  border-radius: 10px;
  padding: 10px 18px;
  cursor: pointer;
  transition: background 0.2s;
}
#sendBtn:hover { background: rgba(180,120,20,0.4); color: #ffcc60; }

/* Modal */
#modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.92);
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
}
#modalBox {
  background: #0d0a06;
  border: 1px solid rgba(255,200,80,0.15);
  border-radius: 16px;
  padding: 28px 24px;
  width: 320px;
  display: flex; flex-direction: column; gap: 16px;
}
#modalBox h2 { font-size: 1.1rem; color: #e8c870; }
#modalBox p { font-size: 0.78rem; color: #5a4a2a; }
#nameInput {
  background: #100e08;
  color: #e8d8b0;
  border: 1px solid rgba(255,200,80,0.2);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 0.9rem;
  font-family: inherit;
  width: 100%;
}
.modal-btns { display: flex; gap: 8px; }
.modal-btns button {
  flex: 1; padding: 10px; border-radius: 8px;
  cursor: pointer; font-family: inherit; font-size: 0.85rem;
}
#guestBtn { background: #100e08; color: #7a6a4a; border: 1px solid rgba(255,200,80,0.1); }
#saveBtn { background: rgba(180,120,20,0.3); color: #e8c870; border: 1px solid rgba(255,200,80,0.25); }
#guestBtn:hover { background: #181408; }
#saveBtn:hover { background: rgba(180,120,20,0.5); }
</style>
</head>
<body>

<div id="modal">
  <div id="modalBox">
    <h2>Welcome to Olyesti</h2>
    <p>Enter your display name to join the lounge.</p>
    <input id="nameInput" type="text" placeholder="Your display name" maxlength="32" />
    <div class="modal-btns">
      <button id="guestBtn">Join as Guest</button>
      <button id="saveBtn">Save & Enter</button>
    </div>
  </div>
</div>

<div id="scene">
  <div id="bg"></div>
  <div id="stage">
    <div class="character" id="char-sl">
      <div class="char-bubble visible" id="bubble-sl">Connected to Second Life</div>
      <div class="avatar" id="avatar-sl">
        <div class="av-hair hair-3"></div>
        <div class="av-head skin-0" style="background:#0d1a2e;box-shadow:inset -6px -4px 0 rgba(0,0,0,0.3);">
          <div class="av-eyes"><div class="av-eye" style="background:#00aaff;"></div><div class="av-eye" style="background:#00aaff;"></div></div>
        </div>
        <div class="av-neck neck-0" style="background:#0d1a2e;"></div>
        <div class="av-body outfit-5"></div>
        <div class="av-legs">
          <div class="av-leg pants-0"></div>
          <div class="av-leg pants-0"></div>
        </div>
      </div>
      <div class="char-name">SL Relay</div>
      <div class="char-shadow"></div>
    </div>
  </div>
</div>

<footer>
  <div id="identityBar">
    <span id="myAvatar">👤</span>
    <span id="myName"></span>
    <span id="changeId">change</span>
  </div>
  <div id="compose">
    <input id="msgInput" type="text" placeholder="Message…" maxlength="300" />
    <button id="sendBtn">Send</button>
  </div>
</footer>

<script>
const SKIN = ['skin-0','skin-1','skin-2','skin-3','skin-4','skin-5'];
const HAIR = ['hair-0','hair-1','hair-2','hair-3','hair-4','hair-5'];
const OUTFIT = ['outfit-0','outfit-1','outfit-2','outfit-3','outfit-4','outfit-5'];
const PANTS = ['pants-0','pants-1','pants-2','pants-3','pants-4','pants-5'];
const NECK = ['neck-0','neck-1','neck-2','neck-3','neck-4','neck-5'];

function hash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) & 0xfffff;
  return h;
}

function buildAvatar(name) {
  const h = hash(name);
  const skin = SKIN[h % 6];
  const hair = HAIR[(h >> 3) % 6];
  const outfit = OUTFIT[(h >> 6) % 6];
  const pants = PANTS[(h >> 9) % 6];
  const neck = NECK[h % 6];

  const wrap = document.createElement('div');
  wrap.className = 'avatar';
  wrap.innerHTML = `
    <div class="av-hair ${hair}"></div>
    <div class="av-head ${skin}">
      <div class="av-eyes"><div class="av-eye"></div><div class="av-eye"></div></div>
      <div class="av-mouth"></div>
    </div>
    <div class="av-neck ${neck}"></div>
    <div class="av-body ${outfit}"></div>
    <div class="av-legs">
      <div class="av-leg ${pants}"></div>
      <div class="av-leg ${pants}"></div>
    </div>
  `;
  return wrap;
}

const nameInput = document.getElementById('nameInput');
const modal = document.getElementById('modal');
const stage = document.getElementById('stage');
const msgInput = document.getElementById('msgInput');
const myNameEl = document.getElementById('myName');
const myAvatarEl = document.getElementById('myAvatar');

let identity = null;
const activeChars = {};

function getOrCreateChar(key, name) {
  if (activeChars[key]) return activeChars[key];

  const char = document.createElement('div');
  char.className = 'character';
  char.style.animationDelay = (Object.keys(activeChars).length * 0.4) + 's';

  const bubble = document.createElement('div');
  bubble.className = 'char-bubble';

  const avatar = buildAvatar(name);

  const nameEl = document.createElement('div');
  nameEl.className = 'char-name';
  nameEl.textContent = name;

  const shadow = document.createElement('div');
  shadow.className = 'char-shadow';

  char.appendChild(bubble);
  char.appendChild(avatar);
  char.appendChild(nameEl);
  char.appendChild(shadow);
  stage.appendChild(char);

  activeChars[key] = { el: char, bubbleEl: bubble, timer: null };
  return activeChars[key];
}

function showMessage(key, name, text) {
  const ch = getOrCreateChar(key, name);
  ch.bubbleEl.textContent = text.slice(0, 120);
  ch.bubbleEl.classList.add('visible');
  if (ch.timer) clearTimeout(ch.timer);
  ch.timer = setTimeout(() => ch.bubbleEl.classList.remove('visible'), 7000);
}

function handleMessage(msg) {
  const slBubble = document.getElementById('bubble-sl');
  if (msg.source === 'secondlife') {
    showMessage('sl_' + msg.speaker, msg.speaker, msg.text);
    slBubble.textContent = msg.speaker + ': ' + msg.text.slice(0, 80);
    slBubble.classList.add('visible');
    setTimeout(() => slBubble.classList.remove('visible'), 5000);
  } else {
    showMessage('web_' + msg.speaker, msg.speaker, msg.text);
  }
}

function loadIdentity() {
  const saved = localStorage.getItem('olyesti_identity');
  if (saved) {
    identity = JSON.parse(saved);
    applyIdentity();
    modal.style.display = 'none';
  }
}

function applyIdentity() {
  myNameEl.textContent = identity.name;
  getOrCreateChar('me', identity.name);
}

document.getElementById('saveBtn').onclick = () => {
  const name = nameInput.value.trim();
  if (!name) { nameInput.focus(); return; }
  identity = { name, guest: false };
  localStorage.setItem('olyesti_identity', JSON.stringify(identity));
  applyIdentity();
  modal.style.display = 'none';
};

document.getElementById('guestBtn').onclick = () => {
  identity = { name: 'Guest' + Math.floor(Math.random()*9000+1000), guest: true };
  applyIdentity();
  modal.style.display = 'none';
};

document.getElementById('changeId').onclick = () => {
  nameInput.value = identity.guest ? '' : identity.name;
  modal.style.display = 'flex';
};

const socket = io();
socket.on('history', msgs => msgs.slice(-5).forEach(m => handleMessage(m)));
socket.on('message', msg => handleMessage(msg));

function send() {
  const text = msgInput.value.trim();
  if (!text || !identity) return;
  socket.emit('web-message', { name: identity.name, text });
  msgInput.value = '';
}

document.getElementById('sendBtn').onclick = send;
msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

loadIdentity();
</script>
</body>
</html>
